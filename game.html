<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON RUNNER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0f;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        // ─── AUDIO ENGINE ───────────────────────────────────────────────────────────
        class AudioEngine {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            playTone(freq, type, duration, vol = 0.1, slideTo, offset = 0) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    const t = this.ctx.currentTime + offset;
                    osc.frequency.setValueAtTime(freq, t);
                    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + duration);
                    gain.gain.setValueAtTime(Math.min(vol, 0.3), t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                    osc.start(t);
                    osc.stop(t + duration);
                } catch (e) {}
            }
            laneSwitch() { this.playTone(220, 'sine', 0.08, 0.10, 440); }
            nearMiss() { [440, 554, 659].forEach((f, i) => this.playTone(f, 'square', 0.06, 0.05, undefined, i * 0.06)); }
            spawn() { this.playTone(50, 'sawtooth', 0.10, 0.03); }
            scoreMilestone() { [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => this.playTone(f, 'sine', 0.15, 0.10,
                undefined, i * 0.10)); }
            highScore() { [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => this.playTone(f, 'square', 0.20,
                0.10, undefined, i * 0.12)); }
            gameOver() { this.playTone(440, 'sawtooth', 0.50, 0.15, 110); }
            comboUp() { this.playTone(880, 'sine', 0.15, 0.10, 1760); }
            alarm(freq, duration) { this.playTone(freq, 'square', duration, 0.1); }
            restoreChime() { [523.25, 659.25, 783.99].forEach((f, i) => this.playTone(f, 'sine', 0.08, 0.1, undefined, i *
                    0.08)); }
            comboRipple() { this.playTone(1200, 'sine', 0.1, 0.1); }
            eventAnnounce() { [220, 277, 330].forEach((f, i) => this.playTone(f, 'sawtooth', 0.4, 0.1, undefined, i *
                0.02)); }
            objectiveComplete() { [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => this.playTone(f, 'sine', 0.12, 0.1,
                undefined, i * 0.12)); }
            inversionStart() { this.playTone(200, 'sawtooth', 0.3, 0.15, 400); }
            glitchStingIn() { this.playTone(300, 'sawtooth', 1.1, 0.08, 55); }
            glitchStingOut() { this.playTone(500, 'sine', 0.3, 0.08, 900); }
            glitchZap() { this.playTone(80 + Math.random() * 900, 'square', 0.05, 0.06); }
            blackoutIn() { this.playTone(70, 'sine', 1.5, 0.06); }
            rushWarn() { this.playTone(500, 'square', 0.35, 0.09, 1000); }
            rushIn() { this.playTone(660, 'square', 0.5, 0.11, 1500); }
            rushPulse() { this.playTone(800 + Math.random() * 500, 'square', 0.07, 0.07); }
            portalEnter() { [180, 260, 340, 520, 700].forEach((f, i) => this.playTone(f, 'sawtooth', 0.35, 0.11, undefined,
                    i * 0.05)); }
            riskPulse() { this.playTone(60 + Math.random() * 30, 'sawtooth', 0.5, 0.045); }
            riskEnd() { [700, 500, 300].forEach((f, i) => this.playTone(f, 'sine', 0.3, 0.08, undefined, i * 0.08)); }
            coinCollect() { [988, 1319].forEach((f, i) => this.playTone(f, 'sine', 0.12, 0.09, undefined, i * 0.05)); }
            xpTick() { this.playTone(700, 'triangle', 0.05, 0.04, 900); }
            levelUp() { [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98].forEach((f, i) => this.playTone(f, 'square',
                0.22, 0.11, undefined, i * 0.09)); }
            purchase() { [523.25, 659.25, 783.99].forEach((f, i) => this.playTone(f, 'sine', 0.15, 0.12, undefined, i *
                    0.08)); }
            equip() { this.playTone(880, 'sine', 0.10, 0.10, 1320); }
        }
        const audio = new AudioEngine();

        // ─── SHOP DATA ──────────────────────────────────────────────────────────────
        const SHOP_CATEGORIES = ['skins', 'colors', 'trails', 'glows', 'shapes'];

        const SHOP_ITEMS = {
            skins: [
                { id: 'default', name: 'Default', cost: 0, pattern: 'solid' },
                { id: 'cyber', name: 'Cyber', cost: 100, pattern: 'cyber' },
                { id: 'neon', name: 'Neon', cost: 200, pattern: 'neon' },
                { id: 'retro', name: 'Retro', cost: 150, pattern: 'retro' },
                { id: 'matrix', name: 'Matrix', cost: 300, pattern: 'matrix' },
                { id: 'sunset', name: 'Sunset', cost: 250, pattern: 'sunset' },
            ],
            colors: [
                { id: 'cyan', name: 'Cyan', cost: 0, color: '#00ffff' },
                { id: 'pink', name: 'Pink', cost: 100, color: '#ff00ff' },
                { id: 'gold', name: 'Gold', cost: 150, color: '#ffd700' },
                { id: 'green', name: 'Green', cost: 100, color: '#00ff88' },
                { id: 'red', name: 'Red', cost: 120, color: '#ff0044' },
                { id: 'purple', name: 'Purple', cost: 120, color: '#aa00ff' },
                { id: 'orange', name: 'Orange', cost: 100, color: '#ff8800' },
                { id: 'white', name: 'White', cost: 200, color: '#ffffff' },
            ],
            trails: [
                { id: 'none', name: 'None', cost: 0, trailType: 'none' },
                { id: 'sparkle', name: 'Sparkle', cost: 100, trailType: 'sparkle' },
                { id: 'fire', name: 'Fire', cost: 150, trailType: 'fire' },
                { id: 'ice', name: 'Ice', cost: 150, trailType: 'ice' },
                { id: 'rainbow', name: 'Rainbow', cost: 250, trailType: 'rainbow' },
                { id: 'plasma', name: 'Plasma', cost: 200, trailType: 'plasma' },
            ],
            glows: [
                { id: 'default', name: 'Default', cost: 0, glowType: 'default' },
                { id: 'pulse', name: 'Pulse', cost: 100, glowType: 'pulse' },
                { id: 'double', name: 'Double', cost: 150, glowType: 'double' },
                { id: 'shatter', name: 'Shatter', cost: 200, glowType: 'shatter' },
                { id: 'ring', name: 'Ring', cost: 150, glowType: 'ring' },
                { id: 'aura', name: 'Aura', cost: 180, glowType: 'aura' },
            ],
            shapes: [
                { id: 'square', name: 'Square', cost: 0, shapeType: 'square' },
                { id: 'triangle', name: 'Triangle', cost: 100, shapeType: 'triangle' },
                { id: 'circle', name: 'Circle', cost: 150, shapeType: 'circle' },
                { id: 'diamond', name: 'Diamond', cost: 120, shapeType: 'diamond' },
                { id: 'star', name: 'Star', cost: 200, shapeType: 'star' },
                { id: 'hexagon', name: 'Hexagon', cost: 180, shapeType: 'hexagon' },
            ],
        };

        // ─── PLAYER PROFILE (persistent progression + shop) ──────────────────────
        const PROFILE_KEY = 'neonRunnerProfile';

        class PlayerProfile {
            constructor() {
                this.coins = 0;
                this.totalCoinsEarned = 0;
                this.gamesPlayed = 0;
                this.totalDistance = 0;
                this.totalPlayTime = 0;
                this.highestScore = 0;
                this.xp = 0;
                this.level = 1;
                // Shop data
                this.unlocked = {};
                this.equipped = {};
                // Initialize shop data
                for (const cat of SHOP_CATEGORIES) {
                    this.unlocked[cat] = [];
                    this.equipped[cat] = null;
                    // Default items (cost 0) are unlocked by default
                    for (const item of SHOP_ITEMS[cat]) {
                        if (item.cost === 0) {
                            this.unlocked[cat].push(item.id);
                            if (!this.equipped[cat]) this.equipped[cat] = item.id;
                        }
                    }
                }
                this.load();
            }

            xpForLevel(level) {
                return Math.floor(100 * Math.pow(level, 1.55));
            }

            load() {
                try {
                    const raw = localStorage.getItem(PROFILE_KEY);
                    if (raw) {
                        const data = JSON.parse(raw);
                        if (data && typeof data === 'object') {
                            this.coins = data.coins ?? 0;
                            this.totalCoinsEarned = data.totalCoinsEarned ?? 0;
                            this.gamesPlayed = data.gamesPlayed ?? 0;
                            this.totalDistance = data.totalDistance ?? 0;
                            this.totalPlayTime = data.totalPlayTime ?? 0;
                            this.highestScore = data.highestScore ?? 0;
                            this.xp = data.xp ?? 0;
                            this.level = data.level ?? 1;
                            // Shop data
                            if (data.unlocked) {
                                for (const cat of SHOP_CATEGORIES) {
                                    if (data.unlocked[cat]) {
                                        this.unlocked[cat] = data.unlocked[cat];
                                    }
                                }
                            }
                            if (data.equipped) {
                                for (const cat of SHOP_CATEGORIES) {
                                    if (data.equipped[cat]) {
                                        this.equipped[cat] = data.equipped[cat];
                                    }
                                }
                            }
                            // Ensure default items are unlocked
                            for (const cat of SHOP_CATEGORIES) {
                                for (const item of SHOP_ITEMS[cat]) {
                                    if (item.cost === 0 && !this.unlocked[cat].includes(item.id)) {
                                        this.unlocked[cat].push(item.id);
                                    }
                                }
                                if (!this.equipped[cat]) {
                                    const def = SHOP_ITEMS[cat].find(i => i.cost === 0);
                                    if (def) this.equipped[cat] = def.id;
                                }
                            }
                        }
                    }
                } catch (e) {}
            }

            save() {
                try {
                    localStorage.setItem(PROFILE_KEY, JSON.stringify({
                        coins: this.coins,
                        totalCoinsEarned: this.totalCoinsEarned,
                        gamesPlayed: this.gamesPlayed,
                        totalDistance: this.totalDistance,
                        totalPlayTime: this.totalPlayTime,
                        highestScore: this.highestScore,
                        xp: this.xp,
                        level: this.level,
                        unlocked: this.unlocked,
                        equipped: this.equipped,
                    }));
                } catch (e) {}
            }

            addCoins(n) {
                this.coins += n;
                this.totalCoinsEarned += n;
                this.save();
            }

            addXP(amount) {
                this.xp += amount;
                let leveledUp = false;
                while (this.xp >= this.xpForLevel(this.level)) {
                    this.xp -= this.xpForLevel(this.level);
                    this.level++;
                    leveledUp = true;
                }
                this.save();
                return leveledUp;
            }

            // ── Shop methods ──
            isUnlocked(category, id) {
                return this.unlocked[category] && this.unlocked[category].includes(id);
            }

            isEquipped(category, id) {
                return this.equipped[category] === id;
            }

            unlockItem(category, id) {
                if (!this.unlocked[category]) this.unlocked[category] = [];
                if (!this.unlocked[category].includes(id)) {
                    this.unlocked[category].push(id);
                    this.save();
                    return true;
                }
                return false;
            }

            equipItem(category, id) {
                if (this.isUnlocked(category, id)) {
                    this.equipped[category] = id;
                    this.save();
                    return true;
                }
                return false;
            }

            getEquipped(category) {
                const id = this.equipped[category];
                if (id) {
                    const item = SHOP_ITEMS[category].find(i => i.id === id);
                    if (item) return item;
                }
                // Fallback to default
                const def = SHOP_ITEMS[category].find(i => i.cost === 0);
                if (def) {
                    this.equipped[category] = def.id;
                    this.save();
                    return def;
                }
                return SHOP_ITEMS[category][0];
            }

            getItem(category, id) {
                return SHOP_ITEMS[category].find(i => i.id === id);
            }

            getUnlockedCount(category) {
                return this.unlocked[category] ? this.unlocked[category].length : 0;
            }

            getTotalItems(category) {
                return SHOP_ITEMS[category].length;
            }
        }

        // ─── GAME ENGINE ─────────────────────────────────────────────────────────────
        class GameEngine {
            constructor() {
                this.width = 800;
                this.height = 600;
                this.state = 'MENU'; // MENU | PLAYING | DEATH | GAMEOVER | SHOP
                this.gameOverStartTime = 0;

                this.playerLane = 1;
                this.playerX = 400;
                this.playerY = 500;
                this.targetX = 400;
                this.playerVX = 0;
                this.playerAngle = 0;
                this.playerScale = 1.0;
                this.settledInLane = true;
                this.playerTrail = [];

                this.score = 0;
                this.highScore = 0;
                this.combo = 1;
                this.comboCounter = 0;
                this.maxComboReached = 1;
                this.nearMissCount = 0;
                this.obstaclesDodged = 0;

                this.speed = 400;
                this.speedMult = 1;

                this.inverted = false;
                this.inversionState = 'IDLE';
                this.inversionWarningTimer = 0;
                this.inversionBeepCount = 0;
                this.invertTimer = 0;
                this.nextInvertTime = 10;

                this.gridYOffset = 0;
                this.shakeTime = 0;
                this.deathTimer = 0;
                this.flashTimer = 0;
                this.flashColor = '';
                this.newRecord = false;
                this.isHighScoring = false;

                this.obstacles = [];
                this.particles = Array.from({ length: 150 }, () => ({ life: 0 }));
                this.texts = [];
                this.speedLines = [];

                this.stars = Array.from({ length: 60 }, () => ({
                    x: Math.random() * 2000,
                    y: Math.random() * 2000,
                    phase: Math.random() * Math.PI * 2
                }));
                this.nebulae = Array.from({ length: 3 }, () => ({
                    x: Math.random(),
                    y: Math.random(),
                    r: 0.3 + Math.random() * 0.2,
                    vx: (Math.random() - 0.5) * 0.02,
                    vy: (Math.random() - 0.5) * 0.02,
                    color: Math.random() > 0.5 ? 'rgba(68,0,170,' : 'rgba(0,255,255,'
                }));

                this.gameTime = 0;
                this.distanceTraveled = 0;
                this.nextSpawnDistance = 300;

                this.currentEvent = null;
                this.eventTimer = 0;
                this.eventBanner = '';
                this.eventBannerTimer = 0;
                this.gauntletRemaining = 0;
                this.ripple = { active: false, radius: 0, maxRadius: 800, x: 0, y: 0 };

                // Dynamic Events
                this.dynType = null;
                this.dynPhase = 'IDLE';
                this.dynWarningTimer = 0;
                this.dynTimer = 0;
                this.dynIntensity = 0;
                this.glitchInverted = false;
                this.glitchSlices = [];
                this.nextDynEventTime = 15 + Math.random() * 15;

                // Risk / Reward Portal
                this.portals = [];
                this.nextPortalDistance = 700 + Math.random() * 400;
                this.riskPhase = 'IDLE';
                this.riskTimer = 0;
                this.riskIntensity = 0;
                this.riskScoreMult = 2;

                // Progression
                this.profile = new PlayerProfile();
                this.coins = [];
                this.nextCoinDistance = 150 + Math.random() * 150;
                this.sessionCoinsEarned = 0;
                this.sessionXPEarned = 0;
                this.survivalXPAccum = 0;
                this.levelUpTimer = 0;
                this.levelUpLevel = this.profile.level;

                // Mouse / hover
                this.mouseX = 0;
                this.mouseY = 0;
                this.hoverPlay = false;
                this.hoverRestart = false;
                this.hoverShop = false;
                this.hoverShopBack = false;

                // Shop state
                this.shopCategory = 'skins';
                this.shopSelectedItem = null;
                this.shopPreviewItem = null;
                this.shopScrollOffset = 0;
                this.shopPurchaseFlash = 0;
                this.shopPurchaseText = '';
                this.shopPurchaseTextTimer = 0;

                this.allObjectives = [
                    { id: 'survive', text: 'Survive 30s', target: 30, get: () => this.gameTime },
                    { id: 'near_miss', text: '5 Near Misses', target: 5, get: () => this.nearMissCount },
                    { id: 'combo', text: 'Reach Combo x5', target: 5, get: () => this.maxComboReached },
                    { id: 'dodge', text: 'Dodge 20 obst.', target: 20, get: () => this.obstaclesDodged },
                    { id: 'score', text: 'Score 1000', target: 1000, get: () => this.score }
                ];
                this.activeObjectives = [];

                const hs = localStorage.getItem('neonRunnerHighScore');
                if (hs) this.highScore = parseInt(hs, 10);
                this._initSpeedLines();

                // Shop category button hover states
                this.shopCatHover = {};
                this.shopItemHover = {};
            }

            _initSpeedLines() {
                this.speedLines = Array.from({ length: 20 }, () => ({
                    x: Math.random() * 3000,
                    y: Math.random() * 3000,
                    length: 20 + Math.random() * 80,
                    speed: 1.5 + Math.random() * 1.0
                }));
            }

            resize(w, h) {
                this.width = w;
                this.height = h;
                this.playerY = h * 0.8;
                this.targetX = this._laneX(this.playerLane);
                this.playerX = this.targetX;
            }

            _laneX(lane) {
                return this.width * (lane / 3) + (this.width / 6);
            }

            handleInput(action) {
                if (this.state === 'MENU') {
                    if (action === 'ACTION') this.startGame();
                    if (action === 'SHOP') this.openShop();
                    return;
                }
                if (this.state === 'SHOP') {
                    if (action === 'BACK') this.closeShop();
                    return;
                }
                if (this.state === 'GAMEOVER') {
                    if (action === 'ACTION') this.startGame();
                    return;
                }
                if (this.state === 'PLAYING') {
                    const inv = this.inverted !== this.glitchInverted;
                    if (action === 'LEFT') this._movePlayer(inv ? 1 : -1);
                    if (action === 'RIGHT') this._movePlayer(inv ? -1 : 1);
                }
            }

            _movePlayer(dir) {
                const nl = this.playerLane + dir;
                if (nl >= 0 && nl <= 2) {
                    this.playerLane = nl;
                    audio.laneSwitch();
                }
            }

            startGame() {
                this.state = 'PLAYING';
                this.score = 0;
                this.combo = 1;
                this.comboCounter = 0;
                this.maxComboReached = 1;
                this.nearMissCount = 0;
                this.obstaclesDodged = 0;
                this.speed = 400;
                this.obstacles = [];
                this.particles.forEach(p => p.life = 0);
                this.texts = [];
                this.playerTrail = [];
                this.playerLane = 1;
                this.targetX = this._laneX(1);
                this.playerX = this.targetX;
                this.playerVX = 0;
                this.playerAngle = 0;
                this.playerScale = 1.0;
                this.settledInLane = true;

                this.inverted = false;
                this.inversionState = 'IDLE';

                this.gameTime = 0;
                this.nextInvertTime = 8 + Math.random() * 12;
                this.distanceTraveled = 0;
                this.nextSpawnDistance = 300;
                this.newRecord = false;
                this.isHighScoring = false;

                this.currentEvent = null;
                this.eventTimer = 0;
                this.eventBannerTimer = 0;
                this.gauntletRemaining = 0;
                this.ripple.active = false;

                this.dynType = null;
                this.dynPhase = 'IDLE';
                this.dynWarningTimer = 0;
                this.dynTimer = 0;
                this.dynIntensity = 0;
                this.glitchInverted = false;
                this.glitchSlices = [];
                this.nextDynEventTime = this.gameTime + 15 + Math.random() * 15;

                this.portals = [];
                this.nextPortalDistance = 700 + Math.random() * 400;
                this.riskPhase = 'IDLE';
                this.riskTimer = 0;
                this.riskIntensity = 0;
                this.riskScoreMult = 2;

                const shuffled = [...this.allObjectives].sort(() => 0.5 - Math.random());
                this.activeObjectives = shuffled.slice(0, 3).map(o => ({
                    ...o,
                    completed: false,
                    flashTimer: 0
                }));

                this.coins = [];
                this.nextCoinDistance = 150 + Math.random() * 150;
                this.sessionCoinsEarned = 0;
                this.sessionXPEarned = 0;
                this.survivalXPAccum = 0;
                this.levelUpTimer = 0;

                this.profile.gamesPlayed++;
                this.profile.save();

                audio.spawn();
            }

            // ── SHOP ──────────────────────────────────────────────────────────────────
            openShop() {
                this.state = 'SHOP';
                this.shopCategory = 'skins';
                this.shopSelectedItem = null;
                this.shopPreviewItem = null;
                this.shopScrollOffset = 0;
                this.shopPurchaseFlash = 0;
                this.shopPurchaseText = '';
                this.shopPurchaseTextTimer = 0;
                this.shopCatHover = {};
                this.shopItemHover = {};
                // Select first item
                const items = SHOP_ITEMS[this.shopCategory];
                if (items && items.length) {
                    this.shopSelectedItem = items[0];
                    this.shopPreviewItem = items[0];
                }
                audio.init();
            }

            closeShop() {
                this.state = 'MENU';
                this.shopPurchaseFlash = 0;
                this.shopPurchaseText = '';
                this.shopPurchaseTextTimer = 0;
            }

            shopBuyItem(category, itemId) {
                const item = this.profile.getItem(category, itemId);
                if (!item) return;
                if (this.profile.isUnlocked(category, itemId)) return;
                if (this.profile.coins < item.cost) {
                    this.shopPurchaseText = 'Not enough coins!';
                    this.shopPurchaseTextTimer = 1.5;
                    return;
                }
                // Purchase
                this.profile.addCoins(-item.cost);
                this.profile.unlockItem(category, itemId);
                audio.purchase();
                this.shopPurchaseFlash = 0.6;
                this.shopPurchaseText = `Purchased ${item.name}!`;
                this.shopPurchaseTextTimer = 1.5;
                // Spawn purchase particles
                for (let i = 0; i < 30; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const spd = 80 + Math.random() * 200;
                    this._spawnParticle(
                        this.width / 2 + (Math.random() - 0.5) * 200,
                        this.height / 2 + (Math.random() - 0.5) * 100,
                        Math.cos(angle) * spd,
                        Math.sin(angle) * spd,
                        0.8,
                        '#ffd700'
                    );
                }
                // Auto-equip
                this.profile.equipItem(category, itemId);
                audio.equip();
                // Update selected
                this.shopSelectedItem = item;
                this.shopPreviewItem = item;
            }

            shopEquipItem(category, itemId) {
                if (this.profile.isUnlocked(category, itemId)) {
                    this.profile.equipItem(category, itemId);
                    audio.equip();
                    this.shopPurchaseText = `Equipped ${this.profile.getItem(category, itemId).name}!`;
                    this.shopPurchaseTextTimer = 1.0;
                    this.shopSelectedItem = this.profile.getItem(category, itemId);
                    this.shopPreviewItem = this.shopSelectedItem;
                }
            }

            shopSelectCategory(cat) {
                this.shopCategory = cat;
                this.shopScrollOffset = 0;
                const items = SHOP_ITEMS[cat];
                if (items && items.length) {
                    this.shopSelectedItem = items[0];
                    this.shopPreviewItem = items[0];
                }
            }

            shopSelectItem(item) {
                this.shopSelectedItem = item;
                this.shopPreviewItem = item;
            }

            // ── GAME LOGIC ──────────────────────────────────────────────────────────

            _flash(color, duration) {
                this.flashColor = color;
                this.flashTimer = duration;
            }

            _spawnParticle(x, y, vx, vy, life, color) {
                for (let i = 0; i < this.particles.length; i++) {
                    if (this.particles[i].life <= 0) {
                        const p = this.particles[i];
                        p.x = x;
                        p.y = y;
                        p.vx = vx;
                        p.vy = vy;
                        p.life = life;
                        p.color = color;
                        return;
                    }
                }
            }

            _awardXP(amount, x, y, showText = true) {
                if (amount <= 0) return;
                this.sessionXPEarned += amount;
                if (showText) {
                    this.texts.push({
                        id: Math.random(),
                        text: `+${amount} XP`,
                        x,
                        y,
                        color: '#66ddff',
                        life: 0.9
                    });
                }
                const leveledUp = this.profile.addXP(amount);
                if (leveledUp) this._triggerLevelUp();
            }

            _triggerLevelUp() {
                this.levelUpTimer = 2.4;
                this.levelUpLevel = this.profile.level;
                this._flash('#ffdd33', 0.5);
                audio.levelUp();
                for (let i = 0; i < 36; i++) {
                    const angle = (Math.PI * 2 / 36) * i;
                    const spd = 150 + Math.random() * 300;
                    this._spawnParticle(this.playerX, this.playerY, Math.cos(angle) * spd, Math.sin(angle) * spd, 1.1,
                        '#ffd700');
                }
            }

            _maybeSpawnCoin() {
                if (this.distanceTraveled < this.nextCoinDistance) return;
                const lane = Math.floor(Math.random() * 3);
                this.coins.push({
                    id: Math.random(),
                    lane,
                    y: -70,
                    radius: Math.max(13, this.width * 0.020),
                    phase: Math.random() * Math.PI * 2,
                    spin: 0
                });
                this.nextCoinDistance = this.distanceTraveled + 240 + Math.random() * 260;
            }

            _updateCoins(dt, spd) {
                const pSize = Math.max(20, Math.min(60, this.width * 0.04));
                for (let i = this.coins.length - 1; i >= 0; i--) {
                    const c = this.coins[i];
                    c.y += spd * dt;
                    c.phase += dt * 5;
                    c.spin += dt * 4;
                    const ox = this._laneX(c.lane);
                    const dx = this.playerX - ox,
                        dy = this.playerY - c.y;
                    if (Math.sqrt(dx * dx + dy * dy) < c.radius + pSize * 0.4) {
                        this._collectCoin(ox, c.y);
                        this.coins.splice(i, 1);
                        continue;
                    }
                    if (c.y > this.height + 100) this.coins.splice(i, 1);
                }
            }

            _collectCoin(x, y) {
                const coinValue = 1;
                this.profile.addCoins(coinValue);
                this.sessionCoinsEarned += coinValue;
                for (let k = 0; k < 14; k++) {
                    const angle = Math.random() * Math.PI * 2;
                    const spd = 90 + Math.random() * 180;
                    this._spawnParticle(x, y, Math.cos(angle) * spd, Math.sin(angle) * spd, 0.6, '#ffd700');
                }
                this.texts.push({ id: Math.random(), text: '+1', x, y: y - 20, color: '#ffd700', life: 0.8 });
                audio.coinCollect();
                this._awardXP(5, x, y - 44);
            }

            _spawnWave() {
                if (!this.currentEvent && this.dynPhase === 'IDLE' && this.riskPhase === 'IDLE' && this.state === 'PLAYING') {
                    let r = Math.random();
                    if (this.score > 2000 && r < 0.04) {
                        this.currentEvent = 'BLIND_RUSH';
                        this.eventTimer = 3.0;
                        this.eventBanner = 'BLIND RUSH!';
                        this.eventBannerTimer = 2.0;
                        audio.eventAnnounce();
                    } else if (this.score > 1500 && r < 0.10) {
                        this.currentEvent = 'SCORE_SURGE';
                        this.eventTimer = 5.0;
                        this.eventBanner = 'SCORE SURGE!';
                        this.eventBannerTimer = 2.0;
                        audio.eventAnnounce();
                    } else if (this.score > 1000 && r < 0.15) {
                        this.currentEvent = 'GAUNTLET';
                        this.gauntletRemaining = 5;
                        this.eventBanner = 'GAUNTLET!';
                        this.eventBannerTimer = 2.0;
                        audio.eventAnnounce();
                    } else if (this.score > 500 && r < 0.23) {
                        this.currentEvent = 'TIME_WARP';
                        this.eventTimer = 4.0;
                        this.eventBanner = 'TIME WARP!';
                        this.eventBannerTimer = 2.0;
                        audio.eventAnnounce();
                    }
                }

                if (this.currentEvent === 'GAUNTLET') {
                    if (this.gauntletRemaining > 0) {
                        this.gauntletRemaining--;
                        const lane = Math.floor(Math.random() * 3);
                        this.obstacles.push({
                            id: Math.random(),
                            type: 3,
                            lane,
                            y: -50,
                            width: this.width * 0.20,
                            height: this.height * 0.04,
                            passed: false,
                            nearMissTriggered: false,
                            movingTime: 0,
                            phantomOpacity: 1,
                            isGauntletLast: this.gauntletRemaining === 0
                        });
                        this.nextSpawnDistance = this.distanceTraveled + 150;
                        return;
                    }
                }

                if (this.score > 1000 && Math.random() < 0.1) {
                    const safeLane = Math.floor(Math.random() * 3);
                    this.obstacles.push({
                        id: Math.random(),
                        type: 5,
                        lane: 1,
                        safeLane,
                        y: -50,
                        width: this.width,
                        height: 10,
                        passed: false,
                        nearMissTriggered: false,
                        movingTime: 0,
                        phantomOpacity: 1
                    });
                    return;
                }

                const isHard = this.score > 2000 || this.riskPhase !== 'IDLE';
                const isMedium = this.score > 500 || this.riskPhase !== 'IDLE';

                const archetypes = ['SINGLE', 'GATE'];
                if (isMedium) archetypes.push('MOVING', 'DOUBLE');
                if (isHard) archetypes.push('PHANTOM', 'FAST', 'DIAGONAL');

                const arch = archetypes[Math.floor(Math.random() * archetypes.length)];

                const spawn = (type, lane, yOff = 0) => {
                    this.obstacles.push({
                        id: Math.random(),
                        type,
                        lane,
                        y: -50 - yOff,
                        width: this.width * 0.20,
                        height: this.height * 0.04,
                        passed: false,
                        nearMissTriggered: false,
                        movingTime: 0,
                        phantomOpacity: 0.8
                    });
                };

                if (arch === 'SINGLE') spawn(0, Math.floor(Math.random() * 3));
                else if (arch === 'GATE') spawn(4, Math.floor(Math.random() * 3));
                else if (arch === 'MOVING') spawn(1, Math.floor(Math.random() * 3));
                else if (arch === 'PHANTOM') spawn(2, Math.floor(Math.random() * 3));
                else if (arch === 'FAST') spawn(3, Math.floor(Math.random() * 3));
                else if (arch === 'DOUBLE') {
                    const safe = Math.floor(Math.random() * 3);
                    [0, 1, 2].filter(l => l !== safe).forEach(l => spawn(0, l));
                } else if (arch === 'DIAGONAL') {
                    const start = Math.random() > 0.5 ? 0 : 2;
                    const step = start === 0 ? 1 : -1;
                    for (let i = 0; i < 3; i++) spawn(0, start + i * step, i * this.height * 0.15);
                }
                audio.spawn();
            }

            _die() {
                this.state = 'DEATH';
                this.deathTimer = 0.4;
                this.shakeTime = 0.5;
                this.dynPhase = 'IDLE';
                this.dynType = null;
                this.dynIntensity = 0;
                this.dynWarningTimer = 0;
                this.glitchInverted = false;
                this.riskPhase = 'IDLE';
                this.riskIntensity = 0;
                this.riskTimer = 0;
                this.portals = [];
                for (let i = 0; i < 24; i++) {
                    const angle = (Math.PI * 2 / 24) * i;
                    const spd = 200 + Math.random() * 400;
                    this._spawnParticle(this.playerX, this.playerY, Math.cos(angle) * spd, Math.sin(angle) * spd, 1.0,
                        '#00ffff');
                }
                audio.gameOver();
            }

            _checkCollisions() {
                const pSize = Math.max(20, Math.min(60, this.width * 0.04));
                const pR = {
                    left: this.playerX - pSize / 2,
                    right: this.playerX + pSize / 2,
                    top: this.playerY - pSize / 2,
                    bottom: this.playerY + pSize / 2
                };

                for (const obs of this.obstacles) {
                    if (obs.passed) continue;
                    let ox = this._laneX(obs.lane);
                    if (obs.type === 1) {
                        ox += Math.sin(obs.movingTime) * (this.width / 3);
                        ox = Math.max(this.width / 6, Math.min(this.width * 5 / 6, ox));
                    }
                    const oR = {
                        left: ox - obs.width / 2,
                        right: ox + obs.width / 2,
                        top: obs.y - obs.height / 2,
                        bottom: obs.y + obs.height / 2
                    };

                    if (obs.type === 5) {
                        if (pR.top < obs.y + 5 && pR.bottom > obs.y - 5) {
                            const gapX = this._laneX(obs.safeLane);
                            const gapLeft = gapX - this.width * 0.12;
                            const gapRight = gapX + this.width * 0.12;
                            if (pR.left < gapLeft || pR.right > gapRight) {
                                this._die();
                                return;
                            } else {
                                if (!obs.passed) {
                                    obs.passed = true;
                                    this.score += 50 * this.combo * (this.currentEvent === 'SCORE_SURGE' ? 3 : this
                                        .currentEvent === 'TIME_WARP' ? 2 : 1);
                                    this.obstaclesDodged++;
                                }
                            }
                        }
                        continue;
                    }

                    if (pR.left < oR.right && pR.right > oR.left &&
                        pR.top < oR.bottom && pR.bottom > oR.top) {
                        if (obs.type === 2 && obs.phantomOpacity < 0.2) continue;
                        if (obs.type === 4) {
                            obs.passed = true;
                            this.score += 50 * this.combo * (this.currentEvent === 'SCORE_SURGE' ? 3 : this
                                .currentEvent === 'TIME_WARP' ? 2 : 1);
                            this.obstaclesDodged++;
                            this.texts.push({ id: Math.random(), text: '+50', x: this.playerX, y: this.playerY - 40,
                                color: '#00ff88', life: 1 });
                            this._flash('#00ff88', 0.15);
                            continue;
                        }
                        this._die();
                        return;
                    }

                    if (!obs.nearMissTriggered && obs.y > this.playerY - pSize && obs.y < this.playerY + pSize) {
                        if (obs.type !== 4 && obs.type !== 2 && obs.type !== 5) {
                            const distX = Math.abs(this.playerX - ox);
                            const colDist = obs.width / 2 + pSize / 2;
                            if (distX > colDist && distX < colDist + 50) {
                                obs.nearMissTriggered = true;
                                this.nearMissCount++;
                                this.score += 50 * this.combo * (this.currentEvent === 'SCORE_SURGE' ? 3 : this
                                    .currentEvent === 'TIME_WARP' ? 2 : 1);
                                this.texts.push({ id: Math.random(), text: '+NEAR MISS', x: this.playerX, y: this
                                        .playerY - 40, color: '#00ff88', life: 1 });
                                audio.nearMiss();
                                for (let k = 0; k < 8; k++) {
                                    const angle = Math.random() * Math.PI * 2;
                                    const spd = 100 + Math.random() * 100;
                                    this._spawnParticle(ox + (distX > 0 ? -obs.width / 2 : obs.width / 2), obs.y, Math
                                        .cos(angle) * spd, Math.sin(angle) * spd, 0.5, '#00ff88');
                                }
                                this._awardXP(8, this.playerX, this.playerY - 64);
                            }
                        }
                    }
                }
            }

            // ── DYNAMIC EVENTS ──────────────────────────────────────────────────────
            _dynDuration(type) {
                if (type === 'GLITCH') return 4 + Math.random() * 2;
                if (type === 'BLACKOUT') return 5 + Math.random() * 2.5;
                if (type === 'SPEEDRUSH') return 4 + Math.random() * 2;
                return 4;
            }

            _beginDynEvent(type) {
                this.dynType = type;
                this.dynPhase = 'WARNING';
                this.dynIntensity = 0;
                if (type === 'GLITCH') {
                    this.dynWarningTimer = 1.3;
                    this.eventBanner = 'GLITCH INCOMING';
                    audio.glitchStingIn();
                } else if (type === 'BLACKOUT') {
                    this.dynWarningTimer = 0.9;
                    this.eventBanner = 'BLACKOUT';
                    audio.blackoutIn();
                } else {
                    this.dynWarningTimer = 0.6;
                    this.eventBanner = 'SPEED RUSH!';
                    audio.rushWarn();
                }
                this.eventBannerTimer = 1.4;
            }

            _onDynActivate(type) {
                if (type === 'GLITCH') {
                    this.glitchInverted = true;
                    this._rollGlitchSlices();
                    audio.glitchZap();
                } else if (type === 'BLACKOUT') {
                    audio.blackoutIn();
                } else if (type === 'SPEEDRUSH') {
                    audio.rushIn();
                }
            }

            _rollGlitchSlices() {
                this.glitchSlices = Array.from({ length: 8 }, () => ({
                    y: Math.random() * this.height,
                    h: 3 + Math.random() * 18,
                    dx: (Math.random() - 0.5) * 50,
                    color: Math.random() < 0.5 ? '#ff00ff' : '#00ffff'
                }));
            }

            _updateDynamicEvents(dt) {
                if (this.dynPhase === 'IDLE') {
                    if (!this.currentEvent && this.riskPhase === 'IDLE' && this.gameTime > this.nextDynEventTime) {
                        const pick = Math.random();
                        if (pick < 0.34) this._beginDynEvent('GLITCH');
                        else if (pick < 0.67) this._beginDynEvent('BLACKOUT');
                        else this._beginDynEvent('SPEEDRUSH');
                    }
                    return;
                }
                if (this.dynPhase === 'WARNING') {
                    this.dynWarningTimer -= dt;
                    if (this.dynType === 'GLITCH' && Math.random() < 0.35) audio.glitchStingIn();
                    if (this.dynWarningTimer <= 0) {
                        this.dynPhase = 'ACTIVE';
                        this.dynTimer = this._dynDuration(this.dynType);
                        this._onDynActivate(this.dynType);
                    }
                    return;
                }
                if (this.dynPhase === 'ACTIVE') {
                    this.dynIntensity = Math.min(1, this.dynIntensity + dt * 3.5);
                    this.dynTimer -= dt;
                    if (this.dynType === 'GLITCH') {
                        if (Math.random() < 0.22) this._rollGlitchSlices();
                        if (Math.random() < 0.10) audio.glitchZap();
                    } else if (this.dynType === 'BLACKOUT') {
                        if (Math.random() < 0.02) audio.blackoutIn();
                    } else if (this.dynType === 'SPEEDRUSH') {
                        if (Math.random() < 0.06) audio.rushPulse();
                    }
                    if (this.dynTimer <= 0) {
                        this.dynPhase = 'ENDING';
                        if (this.dynType === 'GLITCH') this.glitchInverted = false;
                        audio.glitchStingOut();
                    }
                    return;
                }
                if (this.dynPhase === 'ENDING') {
                    this.dynIntensity = Math.max(0, this.dynIntensity - dt * 2.5);
                    if (this.dynIntensity <= 0) {
                        this.dynPhase = 'IDLE';
                        this.dynType = null;
                        this.nextDynEventTime = this.gameTime + 20 + Math.random() * 25;
                    }
                }
            }

            // ── RISK PORTAL ──────────────────────────────────────────────────────────
            _maybeSpawnPortal() {
                if (this.riskPhase !== 'IDLE' || this.currentEvent || this.dynPhase !== 'IDLE') return;
                if (this.distanceTraveled < this.nextPortalDistance) return;
                const lane = Math.floor(Math.random() * 3);
                this.portals.push({
                    id: Math.random(),
                    lane,
                    y: -90,
                    radius: Math.max(30, this.width * 0.09),
                    pulsePhase: Math.random() * Math.PI * 2
                });
                this.nextPortalDistance = this.distanceTraveled + 1000 + Math.random() * 600;
                audio.playTone(500 + Math.random() * 80, 'sine', 0.5, 0.04, 700);
            }

            _updatePortals(dt, spd) {
                const pSize = Math.max(20, Math.min(60, this.width * 0.04));
                for (let i = this.portals.length - 1; i >= 0; i--) {
                    const p = this.portals[i];
                    p.y += spd * dt;
                    p.pulsePhase += dt * 4;
                    const ox = this._laneX(p.lane);
                    const dx = this.playerX - ox,
                        dy = this.playerY - p.y;
                    if (Math.sqrt(dx * dx + dy * dy) < p.radius * 0.65 + pSize * 0.35) {
                        this.portals.splice(i, 1);
                        this._enterRiskMode();
                        continue;
                    }
                    if (p.y > this.height + 150) this.portals.splice(i, 1);
                }
            }

            _enterRiskMode() {
                this.riskPhase = 'ACTIVE';
                this.riskTimer = 8 + Math.random() * 3;
                this.riskIntensity = 0;
                this.riskScoreMult = Math.random() < 0.5 ? 2 : 3;
                this.eventBanner = `RISK MODE x${this.riskScoreMult}!`;
                this.eventBannerTimer = 1.6;
                this._flash('#aa00ff', 0.45);
                audio.portalEnter();
            }

            _updateRiskMode(dt) {
                if (this.riskPhase === 'ACTIVE') {
                    this.riskIntensity = Math.min(1, this.riskIntensity + dt * 3);
                    this.riskTimer -= dt;
                    if (Math.random() < 0.05) audio.riskPulse();
                    if (this.riskTimer <= 0) {
                        this.riskPhase = 'ENDING';
                        audio.riskEnd();
                    }
                } else if (this.riskPhase === 'ENDING') {
                    this.riskIntensity = Math.max(0, this.riskIntensity - dt * 2);
                    if (this.riskIntensity <= 0) this.riskPhase = 'IDLE';
                }
            }

            // ── UPDATE ───────────────────────────────────────────────────────────────
            update(dt) {
                if (this.levelUpTimer > 0) this.levelUpTimer -= dt;
                if (this.shopPurchaseFlash > 0) this.shopPurchaseFlash -= dt;
                if (this.shopPurchaseTextTimer > 0) this.shopPurchaseTextTimer -= dt;

                // Hover states for menu
                if (this.state === 'MENU') {
                    const bw = this.width;
                    const bh = this.height;
                    this.hoverPlay = this.mouseX > bw / 2 - 80 && this.mouseX < bw / 2 + 80 &&
                        this.mouseY > bh * 0.60 - 25 && this.mouseY < bh * 0.60 + 25;
                    this.hoverShop = this.mouseX > bw / 2 - 80 && this.mouseX < bw / 2 + 80 &&
                        this.mouseY > bh * 0.60 + 70 - 25 && this.mouseY < bh * 0.60 + 70 + 25;
                }

                if (this.state === 'SHOP') {
                    this.gridYOffset += 100 * dt;
                    this._updateParticles(dt);
                    this._updateTexts(dt);
                    this._updateSpeedLines(dt);
                    return;
                }

                if (this.state === 'MENU' || this.state === 'GAMEOVER') {
                    this.gridYOffset += 100 * dt;
                    this._updateParticles(dt);
                    this._updateTexts(dt);
                    this._updateSpeedLines(dt);
                    if (this.state === 'GAMEOVER') {
                        const bw = this.width,
                            bh = this.height;
                        this.hoverRestart = this.mouseX > bw / 2 - 80 && this.mouseX < bw / 2 + 80 &&
                            this.mouseY > bh * 0.3 + 280 - 25 && this.mouseY < bh * 0.3 + 280 + 25;
                    }
                    return;
                }

                if (this.state === 'DEATH') {
                    this.speedMult = 0.3;
                    this.deathTimer -= dt;
                    this.shakeTime -= dt;
                    this._updateParticles(dt);
                    this._updateTexts(dt);
                    this._updateSpeedLines(dt);
                    if (this.deathTimer <= 0) {
                        this.state = 'GAMEOVER';
                        this.gameOverStartTime = Date.now();
                        if (this.score > this.highScore) {
                            this.highScore = Math.floor(this.score);
                            localStorage.setItem('neonRunnerHighScore', this.highScore.toString());
                            this.newRecord = true;
                            audio.highScore();
                        }
                        this.profile.totalDistance += this.distanceTraveled;
                        this.profile.totalPlayTime += this.gameTime;
                        if (Math.floor(this.score) > this.profile.highestScore) {
                            this.profile.highestScore = Math.floor(this.score);
                        }
                        this.profile.save();
                        if (this.newRecord) {
                            this._awardXP(150, this.width / 2, this.height / 2 - 60);
                        }
                    }
                    return;
                }

                // PLAYING
                this._updateDynamicEvents(dt);
                this._updateRiskMode(dt);

                this.speedMult = 1;
                if (this.currentEvent === 'TIME_WARP') this.speedMult = 0.4;
                if (this.dynType === 'SPEEDRUSH' && this.dynPhase !== 'IDLE') this.speedMult *= (1 + 0.9 * this
                .dynIntensity);
                if (this.riskPhase !== 'IDLE') this.speedMult *= (1 + 0.55 * this.riskIntensity);

                const spd = this.speed * this.speedMult;
                const prevScore = this.score;

                let scoreMultiplier = 1;
                if (this.currentEvent === 'TIME_WARP') scoreMultiplier = 2;
                if (this.currentEvent === 'SCORE_SURGE') scoreMultiplier = 3;
                if (this.dynType === 'SPEEDRUSH' && this.dynPhase !== 'IDLE') scoreMultiplier *= (1 + this.dynIntensity);
                if (this.riskPhase !== 'IDLE') scoreMultiplier *= (1 + (this.riskScoreMult - 1) * this.riskIntensity);

                this.score += spd * dt * 0.05 * scoreMultiplier;
                this.speed += dt * 5;

                if (this.score > this.highScore && this.score > 100) this.isHighScoring = true;
                if (Math.floor(this.score / 100) > Math.floor(prevScore / 100)) audio.scoreMilestone();

                this.gameTime += dt;
                this.survivalXPAccum += dt;
                if (this.survivalXPAccum >= 1) {
                    const wholeSecs = Math.floor(this.survivalXPAccum);
                    this.survivalXPAccum -= wholeSecs;
                    this._awardXP(2 * wholeSecs, this.playerX, this.playerY - 34, false);
                }

                // Inversion Logic
                if (!this.inverted && this.gameTime > this.nextInvertTime) {
                    if (this.inversionState === 'IDLE') {
                        this.inversionState = 'WARNING';
                        this.inversionWarningTimer = 2.0;
                        this.inversionBeepCount = 0;
                    }
                }

                if (this.inversionState === 'WARNING') {
                    if (this.inversionWarningTimer <= 2.0 && this.inversionBeepCount === 0) { audio.alarm(800, 0.15);
                        this.inversionBeepCount++; }
                    if (this.inversionWarningTimer <= 1.5 && this.inversionBeepCount === 1) { audio.alarm(800, 0.15);
                        this.inversionBeepCount++; }
                    if (this.inversionWarningTimer <= 1.0 && this.inversionBeepCount === 2) { audio.alarm(800, 0.15);
                        this.inversionBeepCount++; }
                    this.inversionWarningTimer -= dt;
                    if (this.inversionWarningTimer <= 0) {
                        this.inversionState = 'ACTIVE';
                        this.inverted = true;
                        this.invertTimer = 3 + Math.random() * 2;
                        this._flash('#ff0000', 0.4);
                        audio.inversionStart();
                    }
                } else if (this.inversionState === 'ACTIVE') {
                    this.invertTimer -= dt;
                    if (this.invertTimer <= 0) {
                        this.inversionState = 'IDLE';
                        this.inverted = false;
                        this.nextInvertTime = this.gameTime + 8 + Math.random() * 12;
                        this._flash('#ffffff', 0.2);
                        audio.restoreChime();
                        this.texts.push({ id: Math.random(), text: 'Controls Restored', x: this.width / 2, y: this
                                .height / 2, color: '#00ff88', life: 2.0 });
                    }
                }

                this.comboCounter += dt;
                if (this.comboCounter > 5.0) {
                    if (this.combo < 5) {
                        this.combo++;
                        if (this.combo > this.maxComboReached) this.maxComboReached = this.combo;
                        if (this.combo === 3 || this.combo === 5) {
                            this.ripple = { active: true, radius: 0, maxRadius: 1000, x: this.playerX, y: this
                                    .playerY };
                            audio.comboRipple();
                        }
                        audio.comboUp();
                    }
                    this.comboCounter = 0;
                }

                if (this.ripple && this.ripple.active) {
                    this.ripple.radius += 1500 * dt;
                    if (this.ripple.radius > this.ripple.maxRadius) this.ripple.active = false;
                }

                if (this.flashTimer > 0) this.flashTimer -= dt;
                if (this.eventBannerTimer > 0) this.eventBannerTimer -= dt;
                if (this.currentEvent) {
                    this.eventTimer -= dt;
                    if (this.eventTimer <= 0 && this.currentEvent !== 'GAUNTLET') {
                        this.currentEvent = null;
                    }
                }

                this.gridYOffset += spd * dt;
                this._updateSpeedLines(dt);

                this.targetX = this._laneX(this.playerLane);
                const springK = 200;
                const damp = 12;
                const force = (this.targetX - this.playerX) * springK;
                this.playerVX = this.playerVX + (force - this.playerVX * damp) * dt;
                this.playerX += this.playerVX * dt;
                this.playerAngle = Math.max(-0.26, Math.min(0.26, this.playerVX / 5000));

                if (Math.abs(this.targetX - this.playerX) < 5 && Math.abs(this.playerVX) < 50 && !this.settledInLane) {
                    this.settledInLane = true;
                    this.playerScale = 1.2;
                } else if (Math.abs(this.targetX - this.playerX) > 20) {
                    this.settledInLane = false;
                }
                if (this.playerScale > 1.0) {
                    this.playerScale -= dt * 2;
                    if (this.playerScale < 1.0) this.playerScale = 1.0;
                }

                // ── Trail with cosmetic trail type ──
                this.playerTrail.push({ x: this.playerX, y: this.playerY, angle: this.playerAngle, life: 0.3 });
                if (this.playerTrail.length > 12) this.playerTrail.shift();
                for (const pt of this.playerTrail) pt.life -= dt;

                for (let i = this.obstacles.length - 1; i >= 0; i--) {
                    const obs = this.obstacles[i];
                    let moveSpd = spd;
                    if (obs.type === 3) moveSpd *= 2.5;
                    obs.y += moveSpd * dt;
                    if (obs.type === 1) obs.movingTime += dt * 3;
                    if (obs.type === 2 && obs.y > this.height * 0.2)
                        obs.phantomOpacity = Math.max(0, obs.phantomOpacity - dt * 2);
                    if (!obs.passed && obs.y > this.playerY + this.height * 0.05) {
                        obs.passed = true;
                        if (obs.type !== 5 && obs.type !== 4) this.obstaclesDodged++;
                        if (obs.isGauntletLast) {
                            this.score += 500;
                            this.texts.push({ id: Math.random(), text: '+500 GAUNTLET SURVIVED!', x: this.width / 2,
                                y: this.playerY - 60, color: '#ffd700', life: 2 });
                            this.currentEvent = null;
                        }
                    }
                    if (obs.y > this.height + 100) this.obstacles.splice(i, 1);
                }

                this._updatePortals(dt, spd);
                this._maybeSpawnPortal();

                this._updateCoins(dt, spd);
                this._maybeSpawnCoin();

                this.distanceTraveled += spd * dt;
                if (this.distanceTraveled > this.nextSpawnDistance) {
                    this._spawnWave();
                    const riskDensity = this.riskPhase !== 'IDLE' ? (1 + 0.7 * this.riskIntensity) : 1;
                    const baseDist = Math.max(150, (600 - this.score * 0.1) / riskDensity);
                    this.nextSpawnDistance = this.distanceTraveled + baseDist + Math.random() * 200;
                }

                for (const obj of this.activeObjectives) {
                    if (!obj.completed) {
                        if (obj.get() >= obj.target) {
                            obj.completed = true;
                            obj.flashTimer = 1.0;
                            this.score += 200;
                            audio.objectiveComplete();
                            this.texts.push({ id: Math.random(), text: 'OBJECTIVE COMPLETE!', x: this.width / 2, y: this
                                    .playerY - 80, color: '#ffd700', life: 1.5 });
                            this._awardXP(60, this.width / 2, this.playerY - 104);
                        }
                    } else {
                        if (obj.flashTimer > 0) obj.flashTimer -= dt;
                    }
                }

                this._updateParticles(dt);
                this._updateTexts(dt);
                this._checkCollisions();
            }

            _updateParticles(dt) {
                for (let i = 0; i < this.particles.length; i++) {
                    const p = this.particles[i];
                    if (p.life > 0) {
                        p.x += p.vx * dt;
                        p.y += p.vy * dt;
                        p.life -= dt * 2;
                    }
                }
            }

            _updateTexts(dt) {
                for (let i = this.texts.length - 1; i >= 0; i--) {
                    const t = this.texts[i];
                    t.y -= 50 * dt;
                    t.life -= dt;
                    if (t.life <= 0) this.texts.splice(i, 1);
                }
            }

            _updateSpeedLines(dt) {
                const spd = (this.state === 'MENU' || this.state === 'SHOP' ? 200 : this.speed) * this.speedMult;
                for (const sl of this.speedLines) sl.y += spd * sl.speed * dt;
            }

            // ─── DRAW ──────────────────────────────────────────────────────────────────
            draw(ctx) {
                ctx.fillStyle = '#0a0a0f';
                ctx.fillRect(0, 0, this.width, this.height);

                this._drawBackground(ctx);

                ctx.save();
                if (this.shakeTime > 0) {
                    const amt = (this.shakeTime / 0.5) * 8;
                    ctx.translate((Math.random() - 0.5) * amt, (Math.random() - 0.5) * amt);
                }

                if (this.dynType === 'SPEEDRUSH' && this.dynPhase !== 'IDLE') {
                    const camAmt = this.dynIntensity * 4;
                    ctx.translate((Math.random() - 0.5) * camAmt, (Math.random() - 0.5) * camAmt);
                    const zoom = 1 + 0.035 * this.dynIntensity;
                    ctx.translate(this.width / 2, this.height / 2);
                    ctx.scale(zoom, zoom);
                    ctx.translate(-this.width / 2, -this.height / 2);
                }
                if (this.dynType === 'GLITCH' && this.dynPhase === 'ACTIVE' && Math.random() < 0.06 * this.dynIntensity) {
                    ctx.translate((Math.random() - 0.5) * 30 * this.dynIntensity, 0);
                }

                this._drawGrid(ctx);
                this._drawSpeedLines(ctx);
                this._drawObstacles(ctx);
                this._drawPortals(ctx);
                this._drawCoins(ctx);

                if (this.currentEvent === 'BLIND_RUSH') {
                    ctx.fillStyle = 'rgba(0,0,0,0.85)';
                    ctx.fillRect(0, 0, this.width, this.height);
                }
                if (this.currentEvent === 'TIME_WARP') {
                    ctx.fillStyle = 'rgba(128,0,255,0.15)';
                    ctx.fillRect(0, 0, this.width, this.height);
                }

                if (this.state === 'PLAYING' || this.state === 'MENU' || this.state === 'SHOP') {
                    this._drawPlayer(ctx);
                }
                this._drawParticles(ctx);

                this._drawGlitchOverlay(ctx);
                this._drawBlackoutOverlay(ctx);
                this._drawRiskOverlay(ctx);

                if (this.inverted && this.state === 'PLAYING') {
                    ctx.fillStyle = 'rgba(255,30,0,0.12)';
                    ctx.fillRect(0, 0, this.width, this.height);
                }
                if (this.flashTimer > 0) {
                    ctx.globalAlpha = this.flashTimer / 0.3;
                    ctx.fillStyle = this.flashColor;
                    ctx.fillRect(0, 0, this.width, this.height);
                    ctx.globalAlpha = 1;
                }

                if (this.ripple && this.ripple.active) {
                    ctx.beginPath();
                    ctx.arc(this.ripple.x, this.ripple.y, this.ripple.radius, 0, Math.PI * 2);
                    const alpha = Math.max(0, 1 - (this.ripple.radius / this.ripple.maxRadius));
                    ctx.strokeStyle = `rgba(0, 255, 255, ${alpha})`;
                    ctx.lineWidth = 5;
                    ctx.stroke();
                }

                ctx.restore();

                if (this.state === 'DEATH') {
                    const progress = 1 - (this.deathTimer / 0.4);
                    ctx.globalCompositeOperation = 'saturation';
                    ctx.fillStyle = 'black';
                    ctx.globalAlpha = progress;
                    ctx.fillRect(0, 0, this.width, this.height);
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = `rgba(0,0,0,${progress * 0.5})`;
                    ctx.fillRect(0, 0, this.width, this.height);
                }

                if (this.isHighScoring && this.state === 'PLAYING') {
                    const grad = ctx.createLinearGradient(0, 0, this.width, this.height);
                    grad.addColorStop(0, 'rgba(255, 215, 0, 0.5)');
                    grad.addColorStop(1, 'rgba(255, 215, 0, 0.1)');
                    ctx.lineWidth = 30;
                    ctx.strokeStyle = grad;
                    ctx.strokeRect(15, 15, this.width - 30, this.height - 30);
                }

                this._drawLevelUpEffect(ctx);
                this._drawUI(ctx);

                // Shop overlay (drawn on top of everything)
                if (this.state === 'SHOP') {
                    this._drawShop(ctx);
                }
            }

            // ─── DRAW: BACKGROUND ──────────────────────────────────────────────────
            _drawBackground(ctx) {
                for (const n of this.nebulae) {
                    const grad = ctx.createRadialGradient(n.x * this.width, n.y * this.height, 0, n.x * this.width, n.y *
                        this.height, n.r * this.width);
                    grad.addColorStop(0, n.color + '0.08)');
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, this.width, this.height);
                    n.x = (n.x + n.vx * 0.01) % 1;
                    if (n.x < 0) n.x += 1;
                    n.y = (n.y + n.vy * 0.01) % 1;
                    if (n.y < 0) n.y += 1;
                }
                ctx.fillStyle = '#ffffff';
                for (const s of this.stars) {
                    s.phase += 0.02;
                    ctx.globalAlpha = 0.3 + 0.7 * ((Math.sin(s.phase) + 1) / 2);
                    ctx.fillRect(s.x % this.width, s.y % this.height, 1, 1);
                }
                ctx.globalAlpha = 1;
            }

            // ─── DRAW: GRID ──────────────────────────────────────────────────────────
            _drawGrid(ctx) {
                const vpX = this.width / 2;
                const vpY = 0;
                ctx.strokeStyle = 'rgba(68,0,170,0.15)';
                ctx.lineWidth = 1;
                ctx.shadowBlur = 0;
                for (let i = 0; i <= 6; i++) {
                    const tx = this.width * (i / 6);
                    ctx.beginPath();
                    ctx.moveTo(vpX, vpY);
                    ctx.lineTo(tx, this.height);
                    ctx.stroke();
                }

                const riskLit = this.riskPhase !== 'IDLE';
                const laneColor = riskLit ? '#ff0066' : (this.inverted ? '#ff5500' : '#4400aa');
                ctx.strokeStyle = laneColor;
                ctx.lineWidth = riskLit ? 2 + 2 * this.riskIntensity : 2;
                ctx.shadowBlur = riskLit ? 10 + 10 * this.riskIntensity : 10;
                ctx.shadowColor = laneColor;
                for (let i = 1; i <= 2; i++) {
                    const x = this.width * (i / 3);
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, this.height);
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
                ctx.strokeStyle = riskLit ? `rgba(255,0,100,${0.3 + 0.2 * this.riskIntensity})` : 'rgba(68,0,170,0.3)';
                const spacing = this.height / 10;
                for (let i = 0; i <= 11; i++) {
                    const y = (this.gridYOffset + i * spacing) % (this.height + spacing) - spacing;
                    if (y > 0 && y < this.height) {
                        ctx.beginPath();
                        ctx.moveTo(0, y);
                        ctx.lineTo(this.width, y);
                        ctx.stroke();
                    }
                }
            }

            // ─── DRAW: SPEED LINES ──────────────────────────────────────────────────
            _drawSpeedLines(ctx) {
                const rush = this.dynType === 'SPEEDRUSH' && this.dynPhase !== 'IDLE';
                const boost = rush ? this.dynIntensity : 0;
                ctx.strokeStyle = rush ? `rgba(0,255,255,${0.10 + 0.35 * boost})` : 'rgba(255,255,255,0.10)';
                ctx.lineWidth = 2 + boost * 3;
                for (const sl of this.speedLines) {
                    const sx = sl.x % this.width;
                    const sy = sl.y % this.height;
                    const len = sl.length * (1 + boost * 1.5);
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx, sy + len);
                    ctx.stroke();
                }
            }

            // ─── DRAW: PLAYER (with cosmetics) ─────────────────────────────────────
            _drawPlayer(ctx) {
                const size = Math.max(20, Math.min(60, this.width * 0.04));

                // Get equipped cosmetics
                const colorItem = this.profile.getEquipped('colors');
                const shapeItem = this.profile.getEquipped('shapes');
                const glowItem = this.profile.getEquipped('glows');
                const skinItem = this.profile.getEquipped('skins');
                const trailItem = this.profile.getEquipped('trails');

                const primaryColor = colorItem.color || '#00ffff';
                const shapeType = shapeItem.shapeType || 'square';
                const glowType = glowItem.glowType || 'default';
                const skinPattern = skinItem.pattern || 'solid';
                const trailType = trailItem.trailType || 'none';

                // ── Trail ──
                if (trailType !== 'none') {
                    for (let i = 0; i < this.playerTrail.length; i++) {
                        const pt = this.playerTrail[i];
                        if (pt.life <= 0) continue;
                        const alpha = Math.max(0, pt.life / 0.3) * 0.5;
                        const tSize = size * (0.4 + 0.4 * (pt.life / 0.3));
                        ctx.save();
                        ctx.translate(pt.x, pt.y);
                        ctx.globalAlpha = alpha;

                        let trailColor = primaryColor;
                        if (trailType === 'fire') {
                            const hue = 20 + (1 - pt.life / 0.3) * 40;
                            trailColor = `hsl(${hue},100%,60%)`;
                        } else if (trailType === 'ice') {
                            const hue = 190 + (1 - pt.life / 0.3) * 30;
                            trailColor = `hsl(${hue},100%,70%)`;
                        } else if (trailType === 'rainbow') {
                            const hue = (Date.now() / 50 + i * 30) % 360;
                            trailColor = `hsl(${hue},100%,60%)`;
                        } else if (trailType === 'plasma') {
                            const hue = 280 + Math.sin(Date.now() / 100 + i) * 40;
                            trailColor = `hsl(${hue},100%,60%)`;
                        } else if (trailType === 'sparkle') {
                            trailColor = '#ffffff';
                            ctx.shadowBlur = 15;
                            ctx.shadowColor = '#ffffff';
                            ctx.beginPath();
                            ctx.arc(0, 0, tSize * 0.3, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                            continue;
                        }

                        ctx.fillStyle = trailColor;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = trailColor;
                        ctx.beginPath();
                        ctx.arc(0, 0, tSize * 0.3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }

                // ── Glow ──
                const glowIntensity = 1 + 0.3 * Math.sin(Date.now() / 300);
                ctx.save();
                ctx.translate(this.playerX, this.playerY);
                ctx.scale(this.playerScale, this.playerScale);
                ctx.rotate(Math.PI / 4 + this.playerAngle);

                if (glowType === 'pulse') {
                    const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 200);
                    ctx.shadowBlur = 25 * pulse;
                    ctx.shadowColor = primaryColor;
                } else if (glowType === 'double') {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = primaryColor;
                    // Second glow layer
                    ctx.shadowBlur = 35;
                    ctx.shadowColor = '#ffffff';
                } else if (glowType === 'shatter') {
                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI / 3) * i + Date.now() / 500;
                        const dist = 8 + 4 * Math.sin(Date.now() / 200 + i);
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = primaryColor;
                        ctx.fillStyle = primaryColor;
                        ctx.globalAlpha = 0.2;
                        ctx.beginPath();
                        ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = primaryColor;
                } else if (glowType === 'ring') {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = primaryColor;
                    ctx.strokeStyle = primaryColor;
                    ctx.globalAlpha = 0.4;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, size * 0.9, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = primaryColor;
                } else if (glowType === 'aura') {
                    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 1.4);
                    grad.addColorStop(0, primaryColor + '40');
                    grad.addColorStop(1, primaryColor + '00');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, size * 1.4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = primaryColor;
                } else {
                    // Default glow
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = primaryColor;
                }

                // ── Shape & Skin ──
                const s = size * 0.5;
                ctx.fillStyle = primaryColor;
                ctx.strokeStyle = primaryColor;
                ctx.lineWidth = 2;
                ctx.globalAlpha = 1;

                // Skin pattern
                if (skinPattern === 'cyber') {
                    ctx.fillStyle = primaryColor;
                    ctx.fillRect(-s, -s, size, size);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1;
                    for (let i = 0; i < 4; i++) {
                        const x = -s + (i + 0.5) * size / 4;
                        ctx.beginPath();
                        ctx.moveTo(x, -s);
                        ctx.lineTo(x + size / 8, s);
                        ctx.stroke();
                    }
                } else if (skinPattern === 'neon') {
                    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, s);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.3, primaryColor);
                    grad.addColorStop(1, primaryColor + '80');
                    ctx.fillStyle = grad;
                    ctx.fillRect(-s, -s, size, size);
                } else if (skinPattern === 'retro') {
                    ctx.fillStyle = primaryColor + '60';
                    ctx.fillRect(-s, -s, size, size);
                    const dotSize = size / 8;
                    for (let i = 0; i < 6; i++) {
                        for (let j = 0; j < 6; j++) {
                            if ((i + j) % 2 === 0) {
                                ctx.fillStyle = primaryColor;
                                ctx.fillRect(-s + i * dotSize + dotSize / 2, -s + j * dotSize + dotSize / 2, dotSize * 0.3,
                                    dotSize * 0.3);
                            }
                        }
                    }
                } else if (skinPattern === 'matrix') {
                    ctx.fillStyle = primaryColor;
                    ctx.fillRect(-s, -s, size, size);
