                    ctx.fillStyle = '#00ff41';
                    ctx.globalAlpha = 0.3;
                    for (let i = 0; i < 8; i++) {
                        const x = -s + (i + 0.5) * size / 8;
                        ctx.fillRect(x - 1, -s, 2, size);
                    }
                    ctx.globalAlpha = 1;
                } else if (skinPattern === 'sunset') {
                    const grad = ctx.createLinearGradient(-s, -s, s, s);
                    grad.addColorStop(0, '#ff6b6b');
                    grad.addColorStop(0.3, '#ffd93d');
                    grad.addColorStop(0.6, '#6bcb77');
                    grad.addColorStop(1, '#4d96ff');
                    ctx.fillStyle = grad;
                    ctx.fillRect(-s, -s, size, size);
                } else {
                    // Default: solid
                    ctx.fillStyle = primaryColor;
                    ctx.fillRect(-s, -s, size, size);
                }

                // ── Draw the shape ──
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.strokeStyle = primaryColor;
                ctx.lineWidth = 2;

                const drawShape = (type) => {
                    ctx.beginPath();
                    if (type === 'square') {
                        ctx.rect(-s, -s, size, size);
                    } else if (type === 'triangle') {
                        ctx.moveTo(0, -s);
                        ctx.lineTo(-s, s);
                        ctx.lineTo(s, s);
                        ctx.closePath();
                    } else if (type === 'circle') {
                        ctx.arc(0, 0, s, 0, Math.PI * 2);
                    } else if (type === 'diamond') {
                        ctx.moveTo(0, -s);
                        ctx.lineTo(s, 0);
                        ctx.lineTo(0, s);
                        ctx.lineTo(-s, 0);
                        ctx.closePath();
                    } else if (type === 'star') {
                        for (let i = 0; i < 10; i++) {
                            const angle = (Math.PI / 5) * i - Math.PI / 2;
                            const r = i % 2 === 0 ? s : s * 0.4;
                            if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                            else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                        }
                        ctx.closePath();
                    } else if (type === 'hexagon') {
                        for (let i = 0; i < 6; i++) {
                            const angle = (Math.PI / 3) * i - Math.PI / 6;
                            const r = s;
                            if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                            else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                        }
                        ctx.closePath();
                    }
                };

                // Fill with the skin pattern (already applied)
                // Re-apply shape with stroke
                drawShape(shapeType);
                ctx.stroke();

                // Inner highlight
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                drawShape(shapeType);
                ctx.fill();

                ctx.restore();
            }

            // ─── DRAW: OBSTACLES ────────────────────────────────────────────────────
            _drawObstacles(ctx) {
                for (const obs of this.obstacles) {
                    ctx.save();
                    let ox = this._laneX(obs.lane);
                    if (obs.type === 1) {
                        ox += Math.sin(obs.movingTime) * (this.width / 3);
                        ox = Math.max(this.width / 6, Math.min(this.width * 5 / 6, ox));
                    }
                    let alpha = obs.type === 2 ? obs.phantomOpacity : 1;
                    ctx.globalAlpha = alpha;

                    if (obs.type === 5) {
                        const gapX = this._laneX(obs.safeLane);
                        const gapLeft = gapX - this.width * 0.15;
                        const gapRight = gapX + this.width * 0.15;
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = '#ff00ff';
                        ctx.strokeStyle = '#ff00ff';
                        ctx.lineWidth = 6;
                        ctx.beginPath();
                        ctx.moveTo(0, obs.y);
                        ctx.lineTo(gapLeft, obs.y);
                        ctx.moveTo(gapRight, obs.y);
                        ctx.lineTo(this.width, obs.y);
                        ctx.stroke();
                        const sweepX = (this.gameTime * 1500) % this.width;
                        if (sweepX < gapLeft || sweepX > gapRight) {
                            ctx.fillStyle = '#fff';
                            ctx.beginPath();
                            ctx.arc(sweepX, obs.y, 4, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.restore();
                        continue;
                    }

                    const color = obs.type === 4 ? '#00ff88' : obs.type === 3 ? '#ff5500' : '#ff0055';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = color;
                    ctx.strokeStyle = color;
                    ctx.fillStyle = color;

                    if (obs.type === 0) {
                        const pulse = 0.5 + 0.5 * Math.sin(this.gameTime * Math.PI * 2 / 0.8);
                        ctx.globalAlpha = alpha * (0.4 + 0.4 * pulse);
                        ctx.fillRect(ox - obs.width / 2, obs.y - obs.height / 2, obs.width, obs.height);
                        ctx.globalAlpha = alpha;
                        ctx.lineWidth = 2;
                        ctx.strokeRect(ox - obs.width / 2, obs.y - obs.height / 2, obs.width, obs.height);
                    } else if (obs.type === 1) {
                        ctx.translate(ox, obs.y);
                        ctx.rotate(obs.movingTime * 2);
                        ctx.lineWidth = 2;
                        const s = obs.width * 0.6;
                        ctx.globalAlpha = alpha * 0.3;
                        ctx.fillRect(-s / 2, -s / 2, s, s);
                        ctx.globalAlpha = alpha;
                        ctx.strokeRect(-s / 2, -s / 2, s, s);
                    } else if (obs.type === 2) {
                        ctx.translate(ox, obs.y);
                        ctx.setLineDash([10, 10]);
                        ctx.beginPath();
                        for (let i = 0; i < 6; i++) {
                            const angle = (Math.PI / 3) * i;
                            const hx = Math.cos(angle) * obs.width / 2;
                            const hy = Math.sin(angle) * obs.height * 1.5;
                            if (i === 0) ctx.moveTo(hx, hy);
                            else ctx.lineTo(hx, hy);
                        }
                        ctx.closePath();
                        ctx.globalAlpha = alpha * 0.3;
                        ctx.fill();
                        ctx.globalAlpha = alpha;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        ctx.setLineDash([]);
                    } else if (obs.type === 3) {
                        ctx.translate(ox, obs.y);
                        ctx.beginPath();
                        ctx.moveTo(-obs.width / 2, -obs.height);
                        ctx.lineTo(0, obs.height);
                        ctx.lineTo(obs.width / 2, -obs.height);
                        ctx.lineTo(0, -obs.height / 2);
                        ctx.closePath();
                        ctx.globalAlpha = alpha * 0.4;
                        ctx.fill();
                        ctx.globalAlpha = alpha;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(-obs.width / 4, -obs.height);
                        ctx.lineTo(-obs.width / 4, -obs.height - 40);
                        ctx.moveTo(obs.width / 4, -obs.height);
                        ctx.lineTo(obs.width / 4, -obs.height - 40);
                        ctx.moveTo(0, -obs.height / 2);
                        ctx.lineTo(0, -obs.height / 2 - 60);
                        ctx.globalAlpha = alpha * 0.5;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    } else if (obs.type === 4) {
                        const pulse = 0.7 + 0.3 * Math.sin(this.gameTime * 10);
                        ctx.globalAlpha = pulse;
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(ox - obs.width / 2, obs.y - obs.height / 2);
                        ctx.lineTo(ox + obs.width / 2, obs.y - obs.height / 2);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(ox - obs.width / 2, obs.y + obs.height / 2);
                        ctx.lineTo(ox + obs.width / 2, obs.y + obs.height / 2);
                        ctx.stroke();
                        ctx.globalAlpha = 0.2;
                        ctx.fillRect(ox - obs.width / 2, obs.y - obs.height / 2, obs.width, obs.height);
                    }
                    ctx.restore();
                }
            }

            // ─── DRAW: PORTALS ──────────────────────────────────────────────────────
            _drawPortals(ctx) {
                for (const p of this.portals) {
                    const ox = this._laneX(p.lane);
                    const pulse = 0.6 + 0.4 * Math.sin(p.pulsePhase);
                    ctx.save();
                    ctx.translate(ox, p.y);
                    for (let ring = 0; ring < 3; ring++) {
                        ctx.beginPath();
                        ctx.arc(0, 0, p.radius * (0.55 + ring * 0.28) * pulse, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(180,0,255,${0.55 - ring * 0.15})`;
                        ctx.lineWidth = 3;
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = '#aa00ff';
                        ctx.stroke();
                    }
                    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, p.radius);
                    grad.addColorStop(0, 'rgba(255,255,255,0.9)');
                    grad.addColorStop(0.4, 'rgba(200,0,255,0.65)');
                    grad.addColorStop(1, 'rgba(150,0,255,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.textAlign = 'center';
                    ctx.font = 'bold 12px monospace';
                    ctx.fillStyle = '#ffccff';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#aa00ff';
                    ctx.fillText('⚠ RISK', 0, -p.radius - 12);
                    ctx.restore();
                }
            }

            // ─── DRAW: COINS ─────────────────────────────────────────────────────────
            _drawCoins(ctx) {
                for (const c of this.coins) {
                    const ox = this._laneX(c.lane);
                    const bob = Math.sin(c.phase) * 6;
                    const squash = Math.max(0.25, Math.abs(Math.cos(c.spin)));
                    ctx.save();
                    ctx.translate(ox, c.y + bob);
                    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, c.radius * 2.2);
                    grad.addColorStop(0, 'rgba(255,215,0,0.55)');
                    grad.addColorStop(0.5, 'rgba(255,180,0,0.18)');
                    grad.addColorStop(1, 'rgba(255,180,0,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, c.radius * 2.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.scale(squash, 1);
                    ctx.shadowBlur = 14;
                    ctx.shadowColor = '#ffd700';
                    ctx.fillStyle = '#ffe066';
                    ctx.strokeStyle = '#ffb700';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, c.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#fff8dc';
                    ctx.font = `bold ${Math.floor(c.radius * 1.1)}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('¢', 0, 1);
                    ctx.textBaseline = 'alphabetic';
                    ctx.restore();
                }
            }

            // ─── DRAW: RISK OVERLAY ─────────────────────────────────────────────────
            _drawRiskOverlay(ctx) {
                if (this.riskPhase === 'IDLE') return;
                const a = this.riskIntensity;
                if (a <= 0) return;
                ctx.save();
                const grad = ctx.createRadialGradient(
                    this.width / 2, this.height / 2, this.height * 0.18,
                    this.width / 2, this.height / 2, this.height * 0.78
                );
                grad.addColorStop(0, 'rgba(0,0,0,0)');
                grad.addColorStop(1, `rgba(140,0,70,${0.4 * a})`);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, this.width, this.height);
                const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 180);
                ctx.fillStyle = `rgba(220,0,140,${0.06 * a * pulse})`;
                ctx.fillRect(0, 0, this.width, this.height);
                ctx.restore();
            }

            // ─── DRAW: PARTICLES ────────────────────────────────────────────────────
            _drawParticles(ctx) {
                for (const p of this.particles) {
                    if (p.life <= 0) continue;
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }

            // ─── DRAW: GLITCH OVERLAY ───────────────────────────────────────────────
            _drawGlitchOverlay(ctx) {
                if (this.dynType !== 'GLITCH' || this.dynPhase === 'IDLE' || this.dynPhase === 'WARNING') return;
                const a = this.dynIntensity;
                if (a <= 0) return;
                ctx.save();
                const hue = (Date.now() / 4) % 360;
                ctx.fillStyle = `hsla(${hue},100%,55%,${0.06 * a})`;
                ctx.fillRect(0, 0, this.width, this.height);
                ctx.globalCompositeOperation = 'lighter';
                for (const g of this.glitchSlices) {
                    ctx.fillStyle = g.color;
                    ctx.globalAlpha = 0.18 * a;
                    ctx.fillRect(g.dx, g.y, this.width, g.h);
                }
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                ctx.strokeStyle = `rgba(0,255,255,${0.05 * a})`;
                ctx.lineWidth = 1;
                for (let y = 0; y < this.height; y += 4) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(this.width, y);
                    ctx.stroke();
                }
                ctx.restore();
            }

            // ─── DRAW: BLACKOUT OVERLAY ─────────────────────────────────────────────
            _drawBlackoutOverlay(ctx) {
                if (this.dynType !== 'BLACKOUT' || this.dynPhase === 'IDLE' || this.dynPhase === 'WARNING') return;
                const a = this.dynIntensity;
                if (a <= 0) return;
                ctx.save();
                ctx.fillStyle = `rgba(0,0,0,${0.96 * a})`;
                ctx.fillRect(0, 0, this.width, this.height);
                ctx.globalCompositeOperation = 'destination-out';
                const r = Math.max(this.width, this.height) * 0.16;
                const holeGrad = ctx.createRadialGradient(this.playerX, this.playerY, 0, this.playerX, this.playerY, r);
                holeGrad.addColorStop(0, `rgba(0,0,0,${a})`);
                holeGrad.addColorStop(0.65, `rgba(0,0,0,${0.55 * a})`);
                holeGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = holeGrad;
                ctx.beginPath();
                ctx.arc(this.playerX, this.playerY, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // ─── DRAW: LEVEL UP EFFECT ──────────────────────────────────────────────
            _drawLevelUpEffect(ctx) {
                if (this.levelUpTimer <= 0) return;
                const T = 2.4;
                const t = 1 - (this.levelUpTimer / T);
                const cx = this.width / 2,
                    cy = this.height * 0.38;
                ctx.save();
                for (let i = 0; i < 3; i++) {
                    const delay = i * 0.12;
                    const rt = Math.max(0, Math.min(1, (t - delay) / 0.85));
                    if (rt <= 0) continue;
                    const r = rt * (this.width * 0.5);
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255,215,0,${(1 - rt) * 0.6})`;
                    ctx.lineWidth = 4;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ffd700';
                    ctx.stroke();
                }
                const inT = Math.min(1, t / 0.18);
                const outT = Math.max(0, Math.min(1, (t - 0.75) / 0.25));
                const scale = (0.6 + 0.4 * inT) * (1 + 0.15 * Math.sin(t * Math.PI * 6) * (1 - t));
                const alpha = inT * (1 - outT);
                ctx.globalAlpha = alpha;
                ctx.translate(cx, cy);
                ctx.scale(scale, scale);
                ctx.textAlign = 'center';
                ctx.font = 'bold 30px monospace';
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ffd700';
                ctx.fillText('LEVEL UP', 0, -22);
                ctx.font = 'bold 56px monospace';
                ctx.fillStyle = '#ffd700';
                ctx.shadowBlur = 24;
                ctx.fillText(`${this.levelUpLevel}`, 0, 40);
                ctx.restore();
            }

            // ─── DRAW: SHOP ──────────────────────────────────────────────────────────
            _drawShop(ctx) {
                const W = this.width,
                    H = this.height;
                const pad = 20;
                const panelX = pad,
                    panelY = pad;
                const panelW = W - pad * 2,
                    panelH = H - pad * 2;

                // Semi-transparent backdrop
                ctx.fillStyle = 'rgba(10,10,15,0.92)';
                ctx.fillRect(panelX, panelY, panelW, panelH);

                // Border glow
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#4400aa';
                ctx.strokeStyle = '#4400aa';
                ctx.lineWidth = 2;
                ctx.strokeRect(panelX, panelY, panelW, panelH);
                ctx.shadowBlur = 0;

                // ── Top bar ──
                ctx.textAlign = 'left';
                ctx.font = 'bold 32px monospace';
                ctx.fillStyle = '#00ffff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ffff';
                ctx.fillText('✦ COSMETIC SHOP', panelX + 20, panelY + 45);
                ctx.shadowBlur = 0;

                // Coin balance
                ctx.textAlign = 'right';
                ctx.font = 'bold 20px monospace';
                ctx.fillStyle = '#ffd700';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffd700';
                ctx.fillText(`¢ ${this.profile.coins}`, panelX + panelW - 20, panelY + 42);
                ctx.shadowBlur = 0;

                // Close button
                const closeX = panelX + panelW - 50;
                const closeY = panelY + 10;
                const closeSize = 36;
                ctx.strokeStyle = '#ff0055';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0055';
                ctx.strokeRect(closeX, closeY, closeSize, closeSize);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ff0055';
                ctx.font = '24px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('✕', closeX + closeSize / 2, closeY + closeSize - 4);
                // Store close button area for click detection
                this._shopCloseRect = { x: closeX, y: closeY, w: closeSize, h: closeSize };

                // ── Category tabs ──
                const tabY = panelY + 70;
                const tabH = 40;
                const tabPad = 8;
                const totalTabW = SHOP_CATEGORIES.reduce((sum, c) => sum + ctx.measureText(c.toUpperCase()).width + tabPad *
                    2, 0) + (SHOP_CATEGORIES.length - 1) * 10;
                let tabX = panelX + (panelW - totalTabW) / 2;

                const catLabels = {
                    skins: 'SKINS',
                    colors: 'COLORS',
                    trails: 'TRAILS',
                    glows: 'GLOWS',
                    shapes: 'SHAPES'
                };

                for (const cat of SHOP_CATEGORIES) {
                    const label = catLabels[cat] || cat.toUpperCase();
                    const tw = ctx.measureText(label).width + tabPad * 2;
                    const isActive = this.shopCategory === cat;
                    const isHover = this.shopCatHover[cat] || false;

                    ctx.fillStyle = isActive ? 'rgba(0,255,255,0.2)' : (isHover ? 'rgba(255,255,255,0.05)' :
                        'rgba(0,0,0,0.3)');
                    ctx.strokeStyle = isActive ? '#00ffff' : (isHover ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.1)');
                    ctx.lineWidth = isActive ? 2 : 1;
                    ctx.shadowBlur = isActive ? 10 : 0;
                    ctx.shadowColor = '#00ffff';
                    ctx.strokeRect(tabX, tabY, tw, tabH);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = isActive ? '#00ffff' : (isHover ? '#ffffff' : 'rgba(255,255,255,0.6)');
                    ctx.font = isActive ? 'bold 14px monospace' : '14px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(label, tabX + tw / 2, tabY + tabH - 10);

                    // Store rect for click
                    this._shopTabRects = this._shopTabRects || {};
                    this._shopTabRects[cat] = { x: tabX, y: tabY, w: tw, h: tabH };

                    tabX += tw + 10;
                }

                // ── Items grid ──
                const gridY = tabY + tabH + 20;
                const gridH = panelH - gridY + panelY - 120;
                const items = SHOP_ITEMS[this.shopCategory] || [];
                const cols = Math.min(4, Math.floor((panelW - 40) / 160));
                const itemW = Math.min(160, (panelW - 40) / cols);
                const itemH = 130;
                const gap = 12;
                const startX = panelX + (panelW - (cols * (itemW + gap) - gap)) / 2;

                // Clamp scroll
                const totalRows = Math.ceil(items.length / cols);
                const maxScroll = Math.max(0, totalRows * (itemH + gap) - gridH + 40);
                this.shopScrollOffset = Math.max(0, Math.min(this.shopScrollOffset, maxScroll));

                // ── Purchase flash overlay ──
                if (this.shopPurchaseFlash > 0) {
                    ctx.globalAlpha = this.shopPurchaseFlash / 0.6 * 0.3;
                    ctx.fillStyle = '#ffd700';
                    ctx.fillRect(panelX, panelY, panelW, panelH);
                    ctx.globalAlpha = 1;
                }

                // ── Purchase text ──
                if (this.shopPurchaseTextTimer > 0) {
                    ctx.textAlign = 'center';
                    ctx.font = 'bold 28px monospace';
                    ctx.fillStyle = '#ffd700';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ffd700';
                    const alpha = Math.min(1, this.shopPurchaseTextTimer);
                    ctx.globalAlpha = alpha;
                    ctx.fillText(this.shopPurchaseText, panelX + panelW / 2, panelY + gridY + 30);
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                }

                // Draw items
                ctx.save();
                ctx.beginPath();
                ctx.rect(panelX + 10, gridY - 5, panelW - 20, gridH + 10);
                ctx.clip();

                let idx = 0;
                for (const item of items) {
                    const col = idx % cols;
                    const row = Math.floor(idx / cols);
                    const x = startX + col * (itemW + gap);
                    const y = gridY + row * (itemH + gap) - this.shopScrollOffset;
                    idx++;

                    if (y + itemH < gridY - 10 || y > gridY + gridH + 10) continue;

                    const isUnlocked = this.profile.isUnlocked(this.shopCategory, item.id);
                    const isEquipped = this.profile.isEquipped(this.shopCategory, item.id);
                    const isSelected = this.shopSelectedItem && this.shopSelectedItem.id === item.id;
                    const isHover = this.shopItemHover[item.id] || false;

                    // Item card background
                    const cardAlpha = isSelected ? 0.25 : (isHover ? 0.12 : 0.05);
                    ctx.fillStyle = `rgba(255,255,255,${cardAlpha})`;
                    ctx.shadowBlur = isSelected ? 15 : 0;
                    ctx.shadowColor = '#00ffff';
                    ctx.strokeStyle = isSelected ? '#00ffff' : (isHover ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.1)');
                    ctx.lineWidth = isSelected ? 2 : 1;
                    ctx.fillRect(x, y, itemW, itemH);
                    ctx.strokeRect(x, y, itemW, itemH);
                    ctx.shadowBlur = 0;

                    // ── Item preview (small) ──
                    const previewSize = Math.min(40, itemW * 0.35);
                    const pX = x + itemW / 2;
                    const pY = y + 30;

                    // Draw a small version of the cosmetic
                    this._drawShopItemPreview(ctx, pX, pY, previewSize, item);

                    // Item name
                    ctx.textAlign = 'center';
                    ctx.font = 'bold 12px monospace';
                    ctx.fillStyle = isUnlocked ? '#ffffff' : 'rgba(255,255,255,0.5)';
                    ctx.fillText(item.name, x + itemW / 2, y + 70);

                    // Cost / status
                    if (isUnlocked) {
                        if (isEquipped) {
                            ctx.fillStyle = '#00ff88';
                            ctx.font = 'bold 11px monospace';
                            ctx.fillText('✓ EQUIPPED', x + itemW / 2, y + 90);
                        } else {
                            ctx.fillStyle = '#00ccff';
                            ctx.font = 'bold 11px monospace';
                            ctx.fillText('EQUIP', x + itemW / 2, y + 90);
                        }
                    } else {
                        ctx.fillStyle = '#ffd700';
                        ctx.font = 'bold 11px monospace';
                        ctx.fillText(`¢ ${item.cost}`, x + itemW / 2, y + 90);
                    }

                    // Store rect for click
                    this._shopItemRects = this._shopItemRects || {};
                    this._shopItemRects[item.id] = { x, y, w: itemW, h: itemH, item };
                }

                ctx.restore();

                // ── Selected item detail / preview ──
                const detailY = panelY + panelH - 60;
                const detailH = 50;
                if (this.shopPreviewItem) {
                    const item = this.shopPreviewItem;
                    const isUnlocked = this.profile.isUnlocked(this.shopCategory, item.id);
                    const isEquipped = this.profile.isEquipped(this.shopCategory, item.id);

                    // Detail background
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.fillRect(panelX + 10, detailY, panelW - 20, detailH);

                    // Preview
                    const ps = 32;
                    this._drawShopItemPreview(ctx, panelX + 50, detailY + detailH / 2, ps, item);

                    // Name and status
                    ctx.textAlign = 'left';
                    ctx.font = 'bold 16px monospace';
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(item.name, panelX + 80, detailY + detailH / 2 + 6);

                    ctx.font = '12px monospace';
                    ctx.fillStyle = isUnlocked ? (isEquipped ? '#00ff88' : '#00ccff') : '#ffd700';
                    ctx.fillText(isUnlocked ? (isEquipped ? '✓ Equipped' : 'Owned') : `Cost: ¢${item.cost}`, panelX + 200,
                        detailY + detailH / 2 + 6);

                    // Action button
                    const btnX = panelX + panelW - 140;
                    const btnY2 = detailY + 6;
                    const btnW2 = 120;
                    const btnH2 = 38;

                    let btnLabel = 'BUY';
                    let btnColor = '#ffd700';
                    let canAct = true;

                    if (isUnlocked) {
                        if (isEquipped) {
                            btnLabel = 'EQUIPPED';
                            btnColor = '#00ff88';
                            canAct = false;
                        } else {
                            btnLabel = 'EQUIP';
                            btnColor = '#00ccff';
                        }
                    } else {
                        if (this.profile.coins < item.cost) {
                            btnColor = 'rgba(255,255,255,0.2)';
                            canAct = false;
                        }
                    }

                    const isBtnHover = this._shopBtnHover || false;
                    ctx.fillStyle = isBtnHover ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.3)';
                    ctx.strokeStyle = btnColor;
                    ctx.lineWidth = 1.5;
                    ctx.shadowBlur = isBtnHover ? 15 : 0;
                    ctx.shadowColor = btnColor;
                    ctx.fillRect(btnX, btnY2, btnW2, btnH2);
                    ctx.strokeRect(btnX, btnY2, btnW2, btnH2);
                    ctx.shadowBlur = 0;

                    ctx.textAlign = 'center';
                    ctx.font = 'bold 14px monospace';
                    ctx.fillStyle = btnColor;
                    ctx.fillText(btnLabel, btnX + btnW2 / 2, btnY2 + btnH2 / 2 + 5);

                    this._shopActionRect = { x: btnX, y: btnY2, w: btnW2, h: btnH2, canAct, item, isUnlocked,
                    isEquipped };

                    // ── Preview player (larger) ──
                    // We already show a small preview in the card, but we can show a larger one here
                    // Actually, we show the small preview in the card, and the detail area shows a medium preview
                }

                // ── Scroll indicator ──
                if (maxScroll > 5) {
                    const scrollBarX = panelX + panelW - 16;
                    const scrollBarY = gridY;
                    const scrollBarH = gridH;
                    const thumbH = Math.max(20, scrollBarH * (gridH / (totalRows * (itemH + gap) + 20)));
                    const thumbY = scrollBarY + (scrollBarH - thumbH) * (this.shopScrollOffset / maxScroll);
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.fillRect(scrollBarX, scrollBarY, 4, scrollBarH);
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.fillRect(scrollBarX, thumbY, 4, thumbH);
                }

                ctx.shadowBlur = 0;
            }

            // ─── DRAW: Shop item preview (small) ───────────────────────────────────
            _drawShopItemPreview(ctx, x, y, size, item) {
                const cat = this.shopCategory;
                const s = size * 0.5;

                ctx.save();
                ctx.translate(x, y);

                if (cat === 'colors') {
                    // Show a colored square
                    const color = item.color || '#00ffff';
                    ctx.fillStyle = color;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = color;
                    ctx.fillRect(-s, -s, size, size);
                    ctx.shadowBlur = 0;
                } else if (cat === 'shapes') {
                    // Show the shape
                    const color = this.profile.getEquipped('colors').color || '#00ffff';
                    ctx.fillStyle = color;
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = color;
                    const shapeType = item.shapeType || 'square';
                    const drawShape = (type) => {
                        ctx.beginPath();
                        if (type === 'square') { ctx.rect(-s, -s, size, size); } else if (type === 'triangle') { ctx
                                .moveTo(0, -s);
                            ctx.lineTo(-s, s);
                            ctx.lineTo(s, s);
                            ctx.closePath(); } else if (type === 'circle') { ctx.arc(0, 0, s, 0, Math.PI * 2); } else if (
                            type === 'diamond') { ctx.moveTo(0, -s);
                            ctx.lineTo(s, 0);
                            ctx.lineTo(0, s);
                            ctx.lineTo(-s, 0);
                            ctx.closePath(); } else if (type === 'star') {
                            for (let i = 0; i < 10; i++) {
                                const angle = (Math.PI / 5) * i - Math.PI / 2;
                                const r = i % 2 === 0 ? s : s * 0.4;
                                if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                                else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                            }
                            ctx.closePath();
                        } else if (type === 'hexagon') {
                            for (let i = 0; i < 6; i++) {
                                const angle = (Math.PI / 3) * i - Math.PI / 6;
                                const r = s;
                                if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                                else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                            }
                            ctx.closePath();
                        }
                    };
                    drawShape(shapeType);
                    ctx.fill();
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                } else if (cat === 'glows') {
                    // Show a glowing circle
                    const color = this.profile.getEquipped('colors').color || '#00ffff';
                    const glowType = item.glowType || 'default';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = color;
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                    if (glowType === 'double') {
                        ctx.shadowBlur = 40;
                        ctx.shadowColor = '#ffffff';
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(0, 0, s * 0.9, 0, Math.PI * 2);
                        ctx.stroke();
                    } else if (glowType === 'ring') {
                        ctx.shadowBlur = 10;
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(0, 0, s * 0.9, 0, Math.PI * 2);
                        ctx.stroke();
                    } else if (glowType === 'aura') {
                        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 1.2);
                        grad.addColorStop(0, color + '80');
                        grad.addColorStop(1, color + '00');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(0, 0, s * 1.2, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (glowType === 'shatter') {
                        for (let i = 0; i < 6; i++) {
                            const angle = (Math.PI / 3) * i + Date.now() / 500;
                            const dist = s * 0.5 + s * 0.2 * Math.sin(Date.now() / 200 + i);
                            ctx.fillStyle = color;
                            ctx.globalAlpha = 0.3;
                            ctx.beginPath();
                            ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist, 2, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.globalAlpha = 1;
                        ctx.shadowBlur = 10;
                        ctx.fillStyle = color;
                        ctx.beginPath();
                        ctx.arc(0, 0, s * 0.5, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (glowType === 'pulse') {
                        const p = 0.7 + 0.3 * Math.sin(Date.now() / 200);
                        ctx.shadowBlur = 25 * p;
                        ctx.fillStyle = color;
                        ctx.beginPath();
                        ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        // default
                        ctx.shadowBlur = 15;
                        ctx.fillStyle = color;
                        ctx.beginPath();
                        ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                } else if (cat === 'trails') {
                    // Show trail particles
                    const color = this.profile.getEquipped('colors').color || '#00ffff';
                    const trailType = item.trailType || 'none';
                    if (trailType === 'none') {
                        ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        ctx.font = '16px monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText('—', 0, 6);
                    } else {
                        for (let i = 0; i < 5; i++) {
                            const t = i / 5;
                            const px = -s * t * 0.8;
                            const py = (Math.random() - 0.5) * s * 0.4;
                            const ps2 = 2 + 3 * (1 - t);
                            ctx.globalAlpha = 0.5 * (1 - t);
                            let trailColor = color;
                            if (trailType === 'fire') { trailColor = `hsl(${20 + t * 40},100%,60%)`; } else if (
                                trailType === 'ice') { trailColor = `hsl(${190 + t * 30},100%,70%)`; } else if (
                                trailType === 'rainbow') { trailColor = `hsl(${(Date.now() / 50 + i * 60) % 360},100%,60%)`; } else
                                if (trailType === 'plasma') { trailColor =
                                    `hsl(${280 + Math.sin(Date.now() / 100 + i) * 40},100%,60%)`; } else if (
                                trailType === 'sparkle') { trailColor = '#ffffff'; }
                            ctx.fillStyle = trailColor;
                            ctx.shadowBlur = 8;
                            ctx.shadowColor = trailColor;
                            ctx.beginPath();
                            ctx.arc(px, py, ps2 * 0.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.globalAlpha = 1;
                        ctx.shadowBlur = 0;
                    }
                } else if (cat === 'skins') {
                    // Show a square with the skin pattern
                    const color = this.profile.getEquipped('colors').color || '#00ffff';
                    const pattern = item.pattern || 'solid';
                    ctx.fillStyle = color;
                    ctx.fillRect(-s, -s, size, size);
                    if (pattern === 'cyber') {
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 1;
                        for (let i = 0; i < 3; i++) {
                            const x2 = -s + (i + 0.5) * size / 3;
                            ctx.beginPath();
                            ctx.moveTo(x2, -s);
                            ctx.lineTo(x2 + size / 6, s);
                            ctx.stroke();
                        }
                    } else if (pattern === 'neon') {
                        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, s);
                        grad.addColorStop(0, '#ffffff');
                        grad.addColorStop(0.3, color);
                        grad.addColorStop(1, color + '80');
                        ctx.fillStyle = grad;
                        ctx.fillRect(-s, -s, size, size);
                    } else if (pattern === 'retro') {
                        const dotSize = size / 6;
                        for (let i = 0; i < 5; i++) {
                            for (let j = 0; j < 5; j++) {
                                if ((i + j) % 2 === 0) {
                                    ctx.fillStyle = color;
                                    ctx.fillRect(-s + i * dotSize + dotSize / 2, -s + j * dotSize + dotSize / 2, dotSize *
                                        0.3, dotSize * 0.3);
                                }
                            }
                        }
                    } else if (pattern === 'matrix') {
                        ctx.fillStyle = '#00ff41';
                        ctx.globalAlpha = 0.3;
                        for (let i = 0; i < 6; i++) {
                            const x2 = -s + (i + 0.5) * size / 6;
                            ctx.fillRect(x2 - 1, -s, 2, size);
                        }
                        ctx.globalAlpha = 1;
                    } else if (pattern === 'sunset') {
                        const grad = ctx.createLinearGradient(-s, -s, s, s);
                        grad.addColorStop(0, '#ff6b6b');
                        grad.addColorStop(0.3, '#ffd93d');
                        grad.addColorStop(0.6, '#6bcb77');
                        grad.addColorStop(1, '#4d96ff');
                        ctx.fillStyle = grad;
                        ctx.fillRect(-s, -s, size, size);
                    }
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(-s, -s, size, size);
                    ctx.shadowBlur = 0;
                }

                ctx.restore();
            }

            // ─── DRAW: UI ─────────────────────────────────────────────────────────────
            _drawUI(ctx) {
                // Floating texts
                for (const t of this.texts) {
                    ctx.globalAlpha = Math.max(0, t.life);
                    ctx.fillStyle = t.color;
                    ctx.font = 'bold 24px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(t.text, t.x, t.y);
                }
                ctx.globalAlpha = 1;

                if (this.state === 'MENU') {
                    this._drawMenuUI(ctx);
                } else if (this.state === 'PLAYING' || this.state === 'DEATH') {
                    this._drawGameUI(ctx);
                } else if (this.state === 'GAMEOVER') {
                    this._drawGameOverUI(ctx);
                }
                ctx.shadowBlur = 0;
            }

            _drawMenuUI(ctx) {
                const W = this.width,
                    H = this.height;
                ctx.textAlign = 'center';

                // Title with neon glow
                const text = 'NEON RUNNER';
                let tx = W / 2 - (ctx.measureText(text).width / 2);
                ctx.font = 'bold 64px monospace';
                for (let i = 0; i < text.length; i++) {
                    const cycle = (Date.now() / 500 + i * 0.2) % (Math.PI * 2);
                    const r = Math.floor(170 * (Math.sin(cycle) + 1) / 2);
                    const g = Math.floor(255 * (1 - (Math.sin(cycle) + 1) / 2));
                    const b = 255;
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = ctx.fillStyle;
                    const charW = ctx.measureText(text[i]).width;
                    ctx.fillText(text[i], tx + charW / 2, H * 0.30);
                    tx += charW;
                }
                ctx.shadowBlur = 0;
                ctx.font = '16px monospace';
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fillText('HOW FAR CAN YOU GO?', W / 2, H * 0.35);

                // High score
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ffff';
                ctx.strokeRect(W / 2 - 120, H * 0.40, 240, 40);
                ctx.shadowBlur = 0;
                ctx.font = '20px monospace';
                ctx.fillStyle = '#fff';
                ctx.fillText(`HIGH SCORE: ${this.highScore}`, W / 2, H * 0.40 + 26);

                // Profile summary
                ctx.font = '14px monospace';
                ctx.fillStyle = '#66ddff';
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#66ddff';
                ctx.fillText(`LEVEL ${this.profile.level}`, W / 2 - 90, H * 0.40 + 52);
                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = '#ffd700';
                ctx.fillText(`¢ ${this.profile.coins}`, W / 2, H * 0.40 + 52);
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.shadowBlur = 0;
                ctx.fillText(`${this.profile.gamesPlayed} RUNS`, W / 2 + 90, H * 0.40 + 52);

                // Play button
                const btnPulse = this.hoverPlay ? 1.2 + 0.05 * Math.sin(Date.now() / 150) : 1;
                ctx.save();
                ctx.translate(W / 2, H * 0.60);
                ctx.scale(btnPulse, btnPulse);
                ctx.strokeStyle = '#00ffff';
                ctx.fillStyle = this.hoverPlay ? 'rgba(0,255,255,0.2)' : 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ffff';
                ctx.beginPath();
                ctx.rect(-80, -25, 160, 50);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.font = '24px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('PLAY', 0, 8);
                ctx.restore();

                // Shop button
                const shopPulse = this.hoverShop ? 1.2 + 0.05 * Math.sin(Date.now() / 150 + 1) : 1;
                ctx.save();
                ctx.translate(W / 2, H * 0.60 + 70);
                ctx.scale(shopPulse, shopPulse);
                ctx.strokeStyle = '#ff00ff';
                ctx.fillStyle = this.hoverShop ? 'rgba(255,0,255,0.2)' : 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff00ff';
                ctx.beginPath();
                ctx.rect(-80, -25, 160, 50);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.font = '24px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('SHOP', 0, 8);
                ctx.restore();

                ctx.fillStyle = '#fff';
                ctx.font = '16px monospace';
                ctx.globalAlpha = 0.5;
                ctx.fillText('Or tap anywhere', W / 2, H * 0.60 + 120);
                ctx.globalAlpha = 1;
            }

            _drawGameUI(ctx) {
                const W = this.width,
                    H = this.height;
                if (this.currentEvent === 'SCORE_SURGE' || (this.dynType === 'SPEEDRUSH' && this.dynPhase !== 'IDLE')) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffd700';
                    ctx.fillStyle = '#ffd700';
                } else {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#fff';
                    ctx.fillStyle = '#fff';
                }
                ctx.textAlign = 'left';
                ctx.font = 'bold 32px monospace';
                ctx.fillText(`SCORE: ${Math.floor(this.score)}`, 20, 40);

                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ffd700';
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 18px monospace';
                ctx.fillText(`¢ ${this.profile.coins}`, 20, 66);

                const need = this.profile.xpForLevel(this.profile.level);
                const prog = Math.max(0, Math.min(1, this.profile.xp / need));
                ctx.shadowBlur = 0;
                ctx.font = 'bold 14px monospace';
                ctx.fillStyle = '#66ddff';
                ctx.fillText(`LV ${this.profile.level}`, 20, 90);
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.fillRect(70, 80, 110, 8);
                ctx.fillStyle = '#66ddff';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#66ddff';
                ctx.fillRect(70, 80, 110 * prog, 8);
                ctx.shadowBlur = 0;

                if (this.combo > 1) {
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#00ff88';
                    ctx.shadowColor = '#00ff88';
                    ctx.fillText(`COMBO x${this.combo}`, W / 2, 40);
                }

                if (this.inversionState === 'WARNING') {
                    ctx.textAlign = 'center';
                    ctx.fillStyle = (Math.floor(Date.now() / 150) % 2 === 0) ? '#ff0000' : '#ffffff';
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.font = 'bold 40px monospace';
                    const sec = Math.ceil(this.inversionWarningTimer);
                    ctx.fillText(`!! INVERTING IN ${sec}...`, W / 2, H / 2);
                } else if (this.inversionState === 'ACTIVE') {
                    ctx.textAlign = 'center';
                    const p = 0.5 + 0.5 * Math.sin(Date.now() / 100);
                    ctx.fillStyle = `rgba(255, 0, 85, ${p})`;
                    ctx.shadowColor = '#ff0055';
                    ctx.font = 'bold 30px monospace';
                    ctx.fillText('!! CONTROLS INVERTED !!', W / 2, H / 2);
                }

                if (this.dynPhase === 'WARNING') {
                    ctx.save();
                    const flicker = Math.floor(Date.now() / 90) % 2 === 0;
                    if (this.dynType === 'GLITCH') {
                        ctx.strokeStyle = flicker ? '#ff00ff' : '#00ffff';
                        ctx.lineWidth = 6;
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = ctx.strokeStyle;
                        ctx.strokeRect(4, 4, W - 8, H - 8);
                        ctx.textAlign = 'center';
                        ctx.font = 'bold 26px monospace';
                        ctx.fillStyle = ctx.strokeStyle;
                        ctx.fillText('SIGNAL UNSTABLE...', W / 2, H * 0.42);
                    } else if (this.dynType === 'BLACKOUT') {
                        const t = 1 - Math.max(0, this.dynWarningTimer / 0.9);
                        ctx.fillStyle = `rgba(0,0,0,${0.35 * t})`;
                        ctx.fillRect(0, 0, W, H);
                        ctx.textAlign = 'center';
                        ctx.font = 'bold 26px monospace';
                        ctx.fillStyle = flicker ? '#8888ff' : '#4444aa';
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#4444ff';
                        ctx.fillText('LIGHTS FAILING...', W / 2, H * 0.42);
                    } else if (this.dynType === 'SPEEDRUSH') {
                        ctx.strokeStyle = flicker ? '#ffaa00' : '#ff5500';
                        ctx.lineWidth = 4;
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = ctx.strokeStyle;
                        ctx.strokeRect(4, 4, W - 8, H - 8);
                        ctx.textAlign = 'center';
                        ctx.font = 'bold 26px monospace';
                        ctx.fillStyle = ctx.strokeStyle;
                        ctx.fillText('ENGINES CHARGING...', W / 2, H * 0.42);
                    }
                    ctx.restore();
                }

                if (this.eventBannerTimer > 0) {
                    ctx.save();
                    ctx.textAlign = 'center';
                    ctx.font = 'bold 48px monospace';
                    ctx.globalAlpha = Math.min(1, this.eventBannerTimer / 0.5);
                    ctx.fillStyle = '#ff00ff';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ff00ff';
                    ctx.fillText(this.eventBanner, W / 2, H / 3);
                    ctx.restore();
                }

                if (this.riskPhase !== 'IDLE') {
                    ctx.save();
                    ctx.globalAlpha = this.riskIntensity;
                    ctx.textAlign = 'center';
                    ctx.font = 'bold 20px monospace';
                    ctx.fillStyle = '#ff0066';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ff0066';
                    const secs = Math.max(0, this.riskTimer).toFixed(1);
                    ctx.fillText(`⚠ RISK MODE x${this.riskScoreMult} — ${secs}s`, W / 2, 70);
                    ctx.restore();
                }

                if (this.state === 'PLAYING') {
                    ctx.save();
                    ctx.translate(W - 130, H - 90);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.strokeStyle = '#4400aa';
                    ctx.lineWidth = 1;
                    ctx.shadowBlur = 0;
                    ctx.fillRect(0, 0, 120, 80);
                    ctx.strokeRect(0, 0, 120, 80);
                    ctx.font = '10px monospace';
                    ctx.textAlign = 'left';
                    let y = 15;
                    for (const obj of this.activeObjectives) {
                        if (obj.completed) {
                            if (obj.flashTimer > 0) ctx.fillStyle = (Math.floor(obj.flashTimer * 10) % 2 === 0) ?
                                '#ffd700' : '#fff';
                            else ctx.fillStyle = '#888';
                        } else {
                            ctx.fillStyle = '#fff';
                        }
                        ctx.fillText(obj.text, 5, y);
                        ctx.fillStyle = '#333';
                        ctx.fillRect(5, y + 4, 110, 4);
                        ctx.fillStyle = obj.completed ? '#ffd700' : '#00ff88';
                        const prog2 = Math.min(1, obj.get() / obj.target);
                        ctx.fillRect(5, y + 4, 110 * prog2, 4);
                        if (obj.completed) {
                            ctx.strokeStyle = '#ffd700';
                            ctx.beginPath();
                            ctx.moveTo(3, y - 3);
                            ctx.lineTo(115, y - 3);
                            ctx.stroke();
                        }
                        y += 25;
                    }
                    ctx.restore();
                }
            }

            _drawGameOverUI(ctx) {
                const W = this.width,
                    H = this.height;
                const goFade = Math.min(1, (Date.now() - this.gameOverStartTime) / 500);
                ctx.globalAlpha = goFade;

                if (this.newRecord) {
                    ctx.save();
                    ctx.translate(W / 2, H * 0.25);
                    ctx.rotate(Date.now() / 1000);
                    const pulse = 1 + 0.2 * Math.sin(Date.now() / 200);
                    ctx.scale(pulse, pulse);
                    ctx.strokeStyle = '#ffd700';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ffd700';
                    ctx.lineWidth = 2;
                    for (let i = 0; i < 12; i++) {
                        ctx.beginPath();
                        ctx.moveTo(0, 20);
                        ctx.lineTo(0, 100);
                        ctx.stroke();
                        ctx.rotate(Math.PI / 6);
                    }
                    ctx.restore();
                }

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(W / 2 - 170, H * 0.25, 340, 240);
                ctx.strokeStyle = '#ff0055';
                ctx.lineWidth = 2;
                ctx.strokeRect(W / 2 - 170, H * 0.25, 340, 240);

                ctx.textAlign = 'center';
                ctx.font = 'bold 36px monospace';
                ctx.fillStyle = '#ff0055';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0055';
                ctx.fillText('GAME OVER', W / 2, H * 0.25 + 40);
                ctx.shadowBlur = 0;

                ctx.font = '16px monospace';
                ctx.fillStyle = '#aaa';
                ctx.textAlign = 'right';
                const lx = W / 2 - 10;
                const rx = W / 2 + 10;
                ctx.fillText('FINAL SCORE:', lx, H * 0.25 + 80);
                ctx.fillText('HIGH SCORE:', lx, H * 0.25 + 110);
                ctx.fillText('SURVIVAL TIME:', lx, H * 0.25 + 140);
                ctx.fillText('HIGHEST COMBO:', lx, H * 0.25 + 170);
                ctx.fillText('NEAR MISSES:', lx, H * 0.25 + 200);

                ctx.fillStyle = '#fff';
                ctx.textAlign = 'left';
                ctx.fillText(Math.floor(this.score), rx, H * 0.25 + 80);
                ctx.fillText(this.highScore, rx, H * 0.25 + 110);
                const mins = Math.floor(this.gameTime / 60).toString().padStart(2, '0');
                const secs = Math.floor(this.gameTime % 60).toString().padStart(2, '0');
                ctx.fillText(`${mins}:${secs}`, rx, H * 0.25 + 140);
                ctx.fillText(`x${this.maxComboReached}`, rx, H * 0.25 + 170);
                ctx.fillText(this.nearMissCount, rx, H * 0.25 + 200);

                ctx.textAlign = 'center';
                ctx.font = 'bold 15px monospace';
                ctx.fillStyle = '#ffd700';
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#ffd700';
                ctx.fillText(`+${this.sessionCoinsEarned} COINS`, W / 2 - 80, H * 0.25 + 230);
                ctx.fillStyle = '#66ddff';
                ctx.shadowColor = '#66ddff';
                ctx.fillText(`+${this.sessionXPEarned} XP`, W / 2 + 10, H * 0.25 + 230);
                ctx.shadowBlur = 0;
                ctx.font = '13px monospace';
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fillText(`LEVEL ${this.profile.level}  •  ${this.profile.coins} TOTAL COINS`, W / 2, H * 0.25 + 250);

                const rBtnPulse = this.hoverRestart ? 1.2 + 0.05 * Math.sin(Date.now() / 150) : 1;
                ctx.save();
                ctx.translate(W / 2, H * 0.25 + 300);
                ctx.scale(rBtnPulse, rBtnPulse);
                ctx.strokeStyle = '#00ffff';
                ctx.fillStyle = this.hoverRestart ? 'rgba(0,255,255,0.2)' : 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ffff';
                ctx.beginPath();
                ctx.rect(-80, -25, 160, 50);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.font = '24px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('RESTART', 0, 8);
                ctx.restore();

                ctx.fillStyle = '#fff';
                ctx.font = '16px monospace';
                ctx.globalAlpha = 0.5;
                ctx.fillText('Or tap anywhere', W / 2, H * 0.25 + 350);
                ctx.globalAlpha = 1;
            }

            // ─── SHOP INTERACTION ────────────────────────────────────────────────────
            handleShopClick(mx, my) {
                if (this.state !== 'SHOP') return;

                // Close button
                if (this._shopCloseRect) {
                    const r = this._shopCloseRect;
                    if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
                        this.closeShop();
                        return;
                    }
                }

                // Category tabs
                if (this._shopTabRects) {
                    for (const [cat, rect] of Object.entries(this._shopTabRects)) {
                        if (mx >= rect.x && mx <= rect.x + rect.w && my >= rect.y && my <= rect.y + rect.h) {
                            this.shopSelectCategory(cat);
                            return;
                        }
                    }
                }

                // Item grid
                if (this._shopItemRects) {
                    for (const [id, rect] of Object.entries(this._shopItemRects)) {
                        if (mx >= rect.x && mx <= rect.x + rect.w && my >= rect.y && my <= rect.y + rect.h) {
                            this.shopSelectItem(rect.item);
                            return;
                        }
                    }
                }

                // Action button
                if (this._shopActionRect) {
                    const r = this._shopActionRect;
                    if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
                        if (r.canAct) {
                            if (r.isUnlocked && !r.isEquipped) {
                                this.shopEquipItem(this.shopCategory, r.item.id);
                            } else if (!r.isUnlocked) {
                                this.shopBuyItem(this.shopCategory, r.item.id);
                            }
                        }
                        return;
                    }
                }
            }

            handleShopHover(mx, my) {
                if (this.state !== 'SHOP') return;
                // Reset hovers
                this.shopCatHover = {};
                this.shopItemHover = {};
                this._shopBtnHover = false;

                // Category tabs
                if (this._shopTabRects) {
                    for (const [cat, rect] of Object.entries(this._shopTabRects)) {
                        if (mx >= rect.x && mx <= rect.x + rect.w && my >= rect.y && my <= rect.y + rect.h) {
                            this.shopCatHover[cat] = true;
                        }
                    }
                }

                // Items
                if (this._shopItemRects) {
                    for (const [id, rect] of Object.entries(this._shopItemRects)) {
                        if (mx >= rect.x && mx <= rect.x + rect.w && my >= rect.y && my <= rect.y + rect.h) {
                            this.shopItemHover[id] = true;
                        }
                    }
                }

                // Action button
                if (this._shopActionRect) {
                    const r = this._shopActionRect;
                    if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
                        this._shopBtnHover = true;
                    }
                }
            }

            handleShopScroll(delta) {
                if (this.state !== 'SHOP') return;
                const items = SHOP_ITEMS[this.shopCategory] || [];
                const cols = Math.min(4, Math.floor((this.width - 40) / 160));
                const itemH = 130;
                const gap = 12;
                const totalRows = Math.ceil(items.length / cols);
                const gridH = this.height - 350;
                const maxScroll = Math.max(0, totalRows * (itemH + gap) - gridH + 40);
                this.shopScrollOffset = Math.max(0, Math.min(this.shopScrollOffset + delta, maxScroll));
            }
        }

        // ─── BOOTSTRAP ──────────────────────────────────────────────────────────────
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const engine = new GameEngine();

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            engine.resize(canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        // ─── KEYBOARD ───────────────────────────────────────────────────────────────
        window.addEventListener('keydown', e => {
            audio.init();
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') engine.handleInput('LEFT');
            if (e.code === 'ArrowRight' || e.code === 'KeyD') engine.handleInput('RIGHT');
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                engine.handleInput('ACTION');
            }
            if (e.code === 'Escape' && engine.state === 'SHOP') {
                engine.closeShop();
            }
            if (e.code === 'KeyS' && engine.state === 'MENU') {
                engine.handleInput('SHOP');
            }
        });

        // ─── MOUSE ──────────────────────────────────────────────────────────────────
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
            const my = (e.clientY - rect.top) * (canvas.height / rect.height);
            engine.mouseX = mx;
            engine.mouseY = my;
            if (engine.state === 'SHOP') {
                engine.handleShopHover(mx, my);
            }
        });

        canvas.addEventListener('click', e => {
            audio.init();
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
            const my = (e.clientY - rect.top) * (canvas.height / rect.height);

            if (engine.state === 'SHOP') {
                engine.handleShopClick(mx, my);
                return;
            }

            // Menu shop button click
            if (engine.state === 'MENU') {
                const W = engine.width,
                    H = engine.height;
                // Shop button
                if (mx > W / 2 - 80 && mx < W / 2 + 80 &&
                    my > H * 0.60 + 70 - 25 && my < H * 0.60 + 70 + 25) {
                    engine.handleInput('SHOP');
                    return;
                }
            }

            engine.handleInput('ACTION');
        });

        // ─── TOUCH ──────────────────────────────────────────────────────────────────
        let touchX = 0,
            touchY = 0,
            touchT = 0;
        let touchStartX = 0,
            touchStartY = 0;

        canvas.addEventListener('touchstart', e => {
            audio.init();
            const t = e.touches[0];
            touchX = t.clientX;
            touchY = t.clientY;
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            touchT = performance.now();

            const rect = canvas.getBoundingClientRect();
            const mx = (t.clientX - rect.left) * (canvas.width / rect.width);
            const my = (t.clientY - rect.top) * (canvas.height / rect.height);

            if (engine.state === 'SHOP') {
                engine.handleShopClick(mx, my);
                return;
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', e => {
            if (engine.state === 'SHOP') {
                const rect = canvas.getBoundingClientRect();
                const t = e.touches[0];
                const mx = (t.clientX - rect.left) * (canvas.width / rect.width);
                const my = (t.clientY - rect.top) * (canvas.height / rect.height);
                engine.handleShopHover(mx, my);
                // Scroll
                const delta = (touchY - t.clientY) * 1.5;
                if (Math.abs(delta) > 5) {
                    engine.handleShopScroll(delta);
                    touchY = t.clientY;
                }
                return;
            }
            // Swipe for lane changes during gameplay
            if (engine.state === 'PLAYING') {
                const t = e.touches[0];
                const dx = t.clientX - touchX;
                const dy = t.clientY - touchY;
                if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 0.7) {
                    engine.handleInput(dx > 0 ? 'RIGHT' : 'LEFT');
                    touchX = t.clientX;
                    touchY = t.clientY;
                }
            }
        }, { passive: true });

        canvas.addEventListener('touchend', e => {
            if (engine.state === 'SHOP') return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            const dt = performance.now() - touchT;
            if (Math.abs(dx) < 30 && Math.abs(dy) < 30 && dt < 300) {
                if (engine.state === 'MENU') {
                    // Check if shop button was tapped
                    const rect = canvas.getBoundingClientRect();
                    const mx = (e.changedTouches[0].clientX - rect.left) * (canvas.width / rect.width);
                    const my = (e.changedTouches[0].clientY - rect.top) * (canvas.height / rect.height);
                    const W = engine.width,
                        H = engine.height;
                    if (mx > W / 2 - 80 && mx < W / 2 + 80 &&
                        my > H * 0.60 + 70 - 25 && my < H * 0.60 + 70 + 25) {
                        engine.handleInput('SHOP');
                        return;
                    }
                }
                engine.handleInput('ACTION');
            }
        }, { passive: true });

        // ─── WHEEL SCROLL IN SHOP ──────────────────────────────────────────────────
        canvas.addEventListener('wheel', e => {
            if (engine.state === 'SHOP') {
                e.preventDefault();
                engine.handleShopScroll(e.deltaY > 0 ? 30 : -30);
            }
        }, { passive: false });

        // ─── GAME LOOP ──────────────────────────────────────────────────────────────
        let last = performance.now();

        function loop(now) {
            const dt = Math.min((now - last) / 1000, 0.1);
            last = now;
            engine.update(dt);
            engine.draw(ctx);
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);

    })();
</script>
</body>
</html>
